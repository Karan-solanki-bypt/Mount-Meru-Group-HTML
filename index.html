<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#C23528" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23C23528'/%3E%3Ctext x='13' y='18' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='15' fill='white'%3Em%3C/text%3E%3Ccircle cx='7' cy='6' r='2.4' fill='%23FAD201'/%3E%3C/svg%3E" />
<title>Mount Meru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Mount Meru Group brand palette — brick red is the dominant brand accent, gold the
     secondary accent. Typography uses Inter, a modern, highly-legible app typeface. */
  --primary: #C23528;
  --primary-dark: #8F1F15;
  --primary-darker: #6B160E;
  --primary-light: #FBEAE8;
  --primary-tint: #FDF3F2;
  --accent: #FAD201;
  --accent-dark: #DCB800;

  /* Neutral scale — cooler, higher-contrast surfaces for a premium, non-website feel */
  --background: #F4F5F7;
  --surface: #FFFFFF;
  --surface-alt: #F7F8FA;
  --surface-raised: #FFFFFF;

  --text: #1A1C20;
  --text-secondary: #61656D;
  --muted: #94989F;
  --border: #E4E6EA;
  --border-strong: #D2D5DB;
  --divider: #EBEDF0;

  --success: #1B9A5A;
  --success-light: #E4F7ED;
  --warning: #B8860A;
  --warning-light: #FFF6DD;
  --danger: #D1272F;
  --danger-light: #FBE8E9;
  --info: #2569C9;
  --info-light: #E9F1FD;

  --online: #1B9A5A;
  --offline: #94989F;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 32px;
  --space-8: 40px;

  /* Radius scale — modern app curvature, not bubble-rounded */
  --radius-xs: 8px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-full: 999px;

  /* Elevation — soft, low-opacity, tinted toward the text color rather than pure black */
  --shadow-xs: 0 1px 2px rgba(20, 20, 25, 0.05);
  --shadow-sm: 0 2px 6px rgba(20, 20, 25, 0.06), 0 1px 2px rgba(20, 20, 25, 0.05);
  --shadow-md: 0 8px 20px rgba(20, 20, 25, 0.09), 0 2px 6px rgba(20, 20, 25, 0.06);
  --shadow-lg: 0 20px 44px rgba(20, 20, 25, 0.18), 0 4px 12px rgba(20, 20, 25, 0.08);
  --shadow-primary: 0 8px 20px rgba(194, 53, 40, 0.28);

  --header-h: 58px;
  --bottomnav-h: 64px;
  --navrail-w: 88px;
  --statusbar-h: 34px;

  --font: 'Inter', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* Typography scale */
  --text-xs: 11px;
  --text-sm: 12.5px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;

  --ease-standard: cubic-bezier(.22, .9, .36, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  --z-header: 100;
  --z-bottomnav: 100;
  --z-drawer: 300;
  --z-sheet: 400;
  --z-modal: 500;
  --z-toast: 600;
}

:root[data-theme="dark"] {
  --background: #131417;
  --surface: #1C1E22;
  --surface-alt: #202226;
  --surface-raised: #24262B;
  --text: #F3F4F6;
  --text-secondary: #B4B7BE;
  --muted: #83868D;
  --border: #303237;
  --border-strong: #3A3D43;
  --divider: #2B2D32;
  --primary-light: #3A1E1A;
  --primary-tint: #2A1613;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: #1C1E24;
  color: var(--text);
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
svg { width: 1em; height: 1em; flex-shrink: 0; }
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
img { max-width: 100%; display: block; }

/* ---------- preview toolbar: browser-level chrome for switching the mockup's form factor,
   lives outside the device frame entirely — the real app never shows this. ---------- */
.preview-toolbar {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.98);
  padding: 4px;
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(20px);
}
.preview-toolbar button {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: background 160ms var(--ease-standard), color 160ms var(--ease-standard);
}
.preview-toolbar button svg { width: 16px; height: 16px; }
.preview-toolbar button.active { background: var(--primary); color: #fff; box-shadow: var(--shadow-primary); }
.preview-toolbar button:not(.active):hover { background: var(--surface-alt); }

/* ---------- device frame (desktop shows a centered phone) ---------- */
.device-frame {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.device-screen {
  width: 390px;
  height: 844px;
  max-height: 96vh;
  background: var(--background);
  border-radius: 46px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 11px #0C0D10, 0 0 0 12.5px #3E4148, 0 0 0 14px #0C0D10;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

.status-bar {
  height: var(--statusbar-h);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 26px;
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  z-index: 50;
  letter-spacing: -0.01em;
}
.status-icons { display: flex; align-items: center; gap: 5px; }

/* App chrome shell: an optional nav-rail (tablet) sits beside the main column; the main column
   holds the router's screen stack plus an optional bottom-nav (mobile) below it. Neither nav
   element is touched by the router — it only ever clears/fills #app.app-root. */
.app-shell { display: flex; flex: 1 1 auto; min-height: 0; }
.app-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }

.app-root {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--background);
  animation: screenIn 260ms var(--ease-standard);
}
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.screen-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 28px;
  scroll-behavior: smooth;
}
.screen-body.no-pad { padding: 0; }
.screen-body::-webkit-scrollbar { width: 0; }

.full-bleed { min-height: 100%; display: flex; flex-direction: column; }

/* scrollbars hidden on tab strips etc */
.hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
.hide-scrollbar::-webkit-scrollbar { display: none; }

:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============ App Header ============ */
.app-header {
  flex: 0 0 auto;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px 0 6px;
  background: linear-gradient(155deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  position: relative;
  z-index: var(--z-header);
  box-shadow: 0 1px 0 rgba(0,0,0,0.08), 0 4px 14px rgba(111, 22, 14, 0.16);
}
.icon-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full);
  color: inherit;
  flex: 0 0 auto;
  transition: background 140ms var(--ease-standard);
}
.icon-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.94); }
.icon-btn svg { width: 21px; height: 21px; }
.app-header-title {
  flex: 1 1 auto;
  font-size: var(--text-lg);
  font-weight: 700;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.app-header-title small { display: block; font-size: 11px; font-weight: 500; opacity: 0.85; letter-spacing: 0; }
.header-badge-wrap { position: relative; }
.header-badge {
  position: absolute; top: 4px; right: 4px;
  min-width: 15px; height: 15px; border-radius: var(--radius-full);
  background: var(--accent); color: #4A3B00;
  font-size: 9px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  padding: 0 3px;
  border: 1.5px solid var(--primary-dark);
}

/* ============ Bottom Navigation ============ */
.bottom-nav {
  flex: 0 0 auto;
  height: var(--bottomnav-h);
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--divider);
  box-shadow: 0 -8px 24px rgba(20,20,25,0.06);
  z-index: var(--z-bottomnav);
  padding-bottom: env(safe-area-inset-bottom, 0);
  position: relative;
}
.bottom-nav-item {
  flex: 1 1 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; color: var(--muted);
  font-size: 10.5px; font-weight: 600;
  position: relative;
  transition: color 160ms var(--ease-standard);
}
.bottom-nav-item svg { width: 21px; height: 21px; transition: transform 160ms var(--ease-spring); }
.bottom-nav-item.active { color: var(--primary); }
.bottom-nav-item.active svg { transform: translateY(-1px); }
.bottom-nav-item.active::before {
  content: ''; position: absolute; top: 2px; width: 28px; height: 28px; border-radius: var(--radius-full);
  background: var(--primary-light); z-index: -1;
}
.bottom-nav-item:active { opacity: 0.65; }
.bottom-nav-item .nav-dot {
  position: absolute; top: 2px; right: calc(50% - 16px);
  width: 7px; height: 7px; border-radius: 50%; background: var(--danger);
  border: 1.5px solid var(--surface);
}

/* ============ Tablet Navigation Rail ============ */
.nav-rail {
  flex: 0 0 auto;
  width: var(--navrail-w);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  background: var(--surface);
  border-right: 1px solid var(--divider);
  padding: 14px 8px;
  gap: 4px;
  overflow-y: auto;
}
.nav-rail-brand { display: flex; justify-content: center; padding: 4px 0 14px; }
.nav-rail-brand svg { width: 34px; height: 34px; }
.nav-rail-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; padding: 10px 4px; border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: 10.5px; font-weight: 600; text-align: center;
  transition: background 140ms var(--ease-standard), color 140ms var(--ease-standard);
}
.nav-rail-item svg { width: 20px; height: 20px; }
.nav-rail-item:hover { background: var(--surface-alt); }
.nav-rail-item.active { background: var(--primary-light); color: var(--primary); font-weight: 700; }
.nav-rail-item:active { transform: scale(0.96); }

/* ============ Drawer ============ */
.drawer-backdrop {
  position: absolute; inset: 0; background: rgba(12,12,16,0.52);
  z-index: var(--z-drawer); opacity: 0; pointer-events: none; transition: opacity 220ms var(--ease-standard);
  backdrop-filter: blur(2px);
}
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: absolute; top: 0; bottom: 0; left: 0; width: 82%; max-width: 320px;
  background: var(--surface); z-index: calc(var(--z-drawer) + 1);
  transform: translateX(-105%); transition: transform 280ms var(--ease-standard);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.drawer.open { transform: translateX(0); }
.drawer-profile {
  background: linear-gradient(150deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff; padding: 30px 22px 22px;
  flex: 0 0 auto;
}
.drawer-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 20px; margin-bottom: 12px; border: 2px solid rgba(255,255,255,0.35);
}
.drawer-profile .name { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.01em; }
.drawer-profile .role { font-size: 12.5px; opacity: 0.9; margin-top: 3px; }
.drawer-profile .territory { font-size: 11.5px; opacity: 0.75; margin-top: 7px; }
.drawer-nav { flex: 1 1 auto; overflow-y: auto; padding: 10px 10px; }
.drawer-nav-item {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 12px; font-size: 14.5px; font-weight: 500; color: var(--text);
  border-radius: var(--radius-md);
}
.drawer-nav-item svg { width: 19px; height: 19px; color: var(--text-secondary); flex: 0 0 auto; }
.drawer-nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 700; }
.drawer-nav-item.active svg { color: var(--primary); }
.drawer-nav-item:active { background: var(--surface-alt); }
.drawer-divider { height: 1px; background: var(--divider); margin: 8px 0; }
.drawer-footer { padding: 14px 20px calc(18px + env(safe-area-inset-bottom, 0)); border-top: 1px solid var(--divider); flex: 0 0 auto; }
.drawer-footer .version { font-size: 11px; color: var(--muted); text-align: center; margin-top: 12px; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 20px; border-radius: var(--radius-md);
  font-size: 14.5px; font-weight: 700; letter-spacing: -0.005em;
  transition: transform 100ms var(--ease-standard), opacity 100ms var(--ease-standard), background 160ms var(--ease-standard), box-shadow 160ms var(--ease-standard);
  width: 100%;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(155deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; box-shadow: var(--shadow-primary); }
.btn-primary:active { box-shadow: 0 4px 12px rgba(194, 53, 40, 0.22); }
.btn-primary:disabled { background: #EFC0BE; box-shadow: none; }
.btn-secondary { background: var(--primary-light); color: var(--primary); }
.btn-outline { background: var(--surface); border: 1.5px solid var(--border-strong); color: var(--text); }
.btn-outline:active { background: var(--surface-alt); }
.btn-ghost { background: transparent; color: var(--primary); height: auto; padding: 6px 4px; width: auto; }
.btn-danger { background: var(--danger); color: #fff; box-shadow: 0 8px 20px rgba(209, 39, 47, 0.24); }
.btn-sm { height: 37px; font-size: 13px; padding: 0 14px; }
.btn-block { width: 100%; }
.btn-icon-only { width: 44px; height: 44px; padding: 0; border-radius: var(--radius-full); }

/* ============ Photo capture tile / dashed add-row (modern upload & add-item pattern) ============ */
.photo-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
  flex: 1 1 0; padding: 18px 10px; border-radius: var(--radius-md); border: 1.5px dashed var(--border-strong);
  background: var(--surface-alt); color: var(--text-secondary); font-size: 12px; font-weight: 700;
  text-align: center; line-height: 1.3; transition: border-color 140ms var(--ease-standard), background 140ms var(--ease-standard), color 140ms var(--ease-standard);
}
.photo-tile:active { background: var(--primary-light); border-color: var(--primary); }
.photo-tile .photo-tile-icon {
  width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--primary-light); color: var(--primary);
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.photo-tile .photo-tile-icon svg { width: 19px; height: 19px; }
.photo-tile.captured { border-style: solid; border-color: var(--success); background: var(--success-light); color: var(--success); }
.photo-tile.captured .photo-tile-icon { background: var(--success); color: #fff; }

.add-row-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 46px; border-radius: var(--radius-md); border: 1.5px dashed var(--border-strong);
  background: var(--surface-alt); color: var(--primary); font-size: 13.5px; font-weight: 700;
  transition: background 140ms var(--ease-standard), border-color 140ms var(--ease-standard);
}
.add-row-btn svg { width: 17px; height: 17px; }
.add-row-btn:active { background: var(--primary-light); border-color: var(--primary); }

.row-with-remove { display: flex; align-items: center; gap: 8px; }
.row-with-remove .input-wrap, .row-with-remove .input { flex: 1 1 auto; }
.row-remove-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; color: var(--muted); }
.row-remove-btn:active { background: var(--danger-light); color: var(--danger); }
.row-remove-btn svg { width: 17px; height: 17px; }

/* ============ Inputs ============ */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 7px; }
.input-wrap { position: relative; display: flex; align-items: center; }
.input, select.input {
  width: 100%; height: 48px; border-radius: var(--radius-md); border: 1.5px solid var(--border);
  background: var(--surface-alt); padding: 0 14px; font-size: 14.5px; color: var(--text);
  transition: border-color 140ms var(--ease-standard), box-shadow 140ms var(--ease-standard), background 140ms var(--ease-standard);
}
.input:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-light); }
.input.has-suffix { padding-right: 44px; }
.input-suffix-btn { position: absolute; right: 4px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.field-error { color: var(--danger); font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 5px; }
.field-error svg { width: 14px; height: 14px; flex-shrink: 0; }
.input.error { border-color: var(--danger); }
textarea.input { height: auto; padding: 12px 14px; resize: none; }
.checkbox-row { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--text-secondary); }
.checkbox-row input { width: 18px; height: 18px; accent-color: var(--primary); }

/* ============ Cards (generic) ============ */
.card {
  background: var(--surface); border-radius: var(--radius-lg); padding: 16px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--border);
}
.card + .card { margin-top: 12px; }
.card.tappable { transition: transform 120ms var(--ease-standard), box-shadow 120ms var(--ease-standard); }
.card.tappable:active { transform: scale(0.983); background: var(--surface-alt); box-shadow: var(--shadow-xs); }
.section-title {
  font-size: var(--text-sm); font-weight: 700; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.05em;
  margin: 22px 0 11px; display: flex; align-items: center; justify-content: space-between;
}
.section-title .link { text-transform: none; letter-spacing: 0; color: var(--primary); font-weight: 700; font-size: 13px; }

/* KPI cards */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi-card {
  background: var(--surface); border-radius: var(--radius-lg); padding: 15px;
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
}
.kpi-card .kpi-icon {
  width: 34px; height: 34px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
  margin-bottom: 11px;
}
.kpi-card .kpi-icon svg { width: 18px; height: 18px; }
.kpi-card .kpi-value { font-size: var(--text-xl); font-weight: 800; color: var(--text); line-height: 1.15; letter-spacing: -0.01em; }
.kpi-card .kpi-label { font-size: 11.5px; color: var(--text-secondary); margin-top: 3px; font-weight: 500; }
.kpi-card .kpi-trend { font-size: 11px; font-weight: 700; margin-top: 7px; display: inline-flex; align-items: center; gap: 3px; }
.kpi-trend.up { color: var(--success); }
.kpi-trend.down { color: var(--danger); }

.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.quick-action {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 13px 4px; background: var(--surface); border-radius: var(--radius-md);
  border: 1px solid var(--border); font-size: 10.5px; font-weight: 600; color: var(--text-secondary);
  text-align: center; box-shadow: var(--shadow-xs);
}
.quick-action:active { background: var(--surface-alt); transform: scale(0.96); }
.quick-action .qa-icon {
  width: 42px; height: 42px; border-radius: var(--radius-full); background: var(--primary-light); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
}
.quick-action .qa-icon svg { width: 20px; height: 20px; }

/* Outlet card */
.outlet-card { display: flex; flex-direction: column; gap: 8px; }
.outlet-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.outlet-card .o-name { font-size: 14.5px; font-weight: 700; color: var(--text); letter-spacing: -0.005em; }
.o-code { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 1px; }

/* Fixed-choice option rows (e.g. Select Tracker) — same height regardless of how many lines
   each option's subtitle wraps to, so the set reads as one consistent group. */
.card.tappable[data-mode] { min-height: 86px; }
.outlet-card .o-addr { font-size: 12.5px; color: var(--text-secondary); }
.outlet-card .o-meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--radius-full);
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.01em;
}
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-success { background: var(--success-light); color: var(--success); }
.badge-warning { background: var(--warning-light); color: var(--warning); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-info { background: var(--info-light); color: var(--info); }
.badge-muted { background: var(--divider); color: var(--muted); }

/* Sales / stat rows */
.stat-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--divider); }
.stat-row:last-child { border-bottom: none; }
.stat-row .s-label { font-size: 13px; color: var(--text-secondary); flex: 1 1 auto; }
.stat-row .s-value { font-size: 14px; font-weight: 700; color: var(--text); text-align: right; word-break: break-word; flex: 0 1 auto; }

.progress-bar { height: 7px; border-radius: var(--radius-full); background: var(--divider); overflow: hidden; }
.progress-bar > span { display: block; height: 100%; border-radius: var(--radius-full); background: var(--primary); transition: width 450ms var(--ease-standard); }

/* Inventory card */
.inv-card .inv-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
.inv-card .inv-product { font-size: 14px; font-weight: 700; }
.inv-card .inv-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 7px; }
.stock-bar { height: 9px; border-radius: var(--radius-full); background: var(--divider); overflow: hidden; }
.stock-bar > span { display: block; height: 100%; border-radius: var(--radius-full); transition: width 450ms var(--ease-standard); }
.stock-bar.normal > span { background: var(--success); }
.stock-bar.low > span { background: var(--warning); }
.stock-bar.critical > span { background: var(--danger); }

/* Device card */
.device-card { display: flex; align-items: center; gap: 12px; }
.device-icon-wrap { width: 42px; height: 42px; border-radius: var(--radius-sm); background: var(--surface-alt); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.device-icon-wrap svg { width: 21px; height: 21px; color: var(--text-secondary); }
.device-card .d-body { flex: 1 1 auto; min-width: 0; }
.device-card .d-name { font-size: 13.5px; font-weight: 700; }
.device-card .d-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.status-dot.online { background: var(--online); box-shadow: 0 0 0 3px var(--success-light); }
.status-dot.offline { background: var(--offline); box-shadow: 0 0 0 3px var(--divider); }

/* Notification card */
.notif-card { display: flex; gap: 12px; align-items: flex-start; position: relative; }
.notif-card.unread { background: var(--primary-tint); }
.notif-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.notif-icon svg { width: 18px; height: 18px; }
.notif-card .n-title { font-size: 13.5px; font-weight: 700; color: var(--text); }
.notif-card .n-desc { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
.notif-card .n-time { font-size: 11px; color: var(--muted); margin-top: 5px; }
.notif-unread-dot { position: absolute; top: 16px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

/* Indent card */
.indent-card .i-top { display: flex; justify-content: space-between; align-items: flex-start; }
.indent-card .i-num { font-size: 13.5px; font-weight: 700; color: var(--text); }
.indent-card .i-outlet { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.indent-card .i-meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11.5px; color: var(--muted); }

.indent-status-row { display: flex; align-items: flex-start; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--divider); }
.indent-status-step { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.indent-status-step svg { width: 18px; height: 18px; flex: 0 0 auto; }
.indent-status-label { align-self: stretch; min-width: 0; }
.indent-status-step.done { color: var(--success); }

/* ============ Tabs ============ */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab-btn { flex: 0 0 auto; padding: 8px 16px; border-radius: var(--radius-full); font-size: 13px; font-weight: 700; color: var(--text-secondary); background: var(--surface-alt); white-space: nowrap; transition: background 140ms var(--ease-standard), color 140ms var(--ease-standard); }
.tab-btn.active { background: var(--primary); color: #fff; box-shadow: var(--shadow-primary); }

.chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: 0 0 auto; padding: 8px 15px; border-radius: var(--radius-full); font-size: 12.5px; font-weight: 600; background: var(--surface); border: 1.5px solid var(--border); color: var(--text-secondary); white-space: nowrap; transition: background 140ms var(--ease-standard), color 140ms var(--ease-standard), border-color 140ms var(--ease-standard); }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ============ Search bar ============ */
.search-bar { display: flex; align-items: center; gap: 8px; background: var(--surface-alt); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 0 12px; height: 44px; transition: border-color 140ms var(--ease-standard), background 140ms var(--ease-standard); }
.search-bar:focus-within { border-color: var(--primary); background: var(--surface); }
.search-bar svg { width: 18px; height: 18px; color: var(--muted); flex: 0 0 auto; }
.search-bar input { flex: 1 1 auto; height: 100%; border: none; background: transparent; font-size: 14px; }
.search-bar .clear-btn { color: var(--muted); }
.search-row { display: flex; gap: 8px; align-items: center; }
.filter-btn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--surface); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); position: relative; transition: background 140ms var(--ease-standard); }
.filter-btn:active { background: var(--surface-alt); }
.filter-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }

/* ============ Sticky header/footer helpers ============ */
.sticky-footer { flex: 0 0 auto; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0)); background: var(--surface); border-top: 1px solid var(--border); }
.sticky-footer.row { display: flex; gap: 10px; }

/* ============ Overlays: modal / bottom sheet ============ */
.overlay-backdrop { position: absolute; inset: 0; background: rgba(12,12,16,0.52); z-index: var(--z-modal); opacity: 0; transition: opacity 220ms var(--ease-standard); backdrop-filter: blur(2px); }
.overlay-backdrop.open { opacity: 1; }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 84%;
  background: var(--surface); border-radius: 22px 22px 0 0; z-index: calc(var(--z-modal) + 1);
  transform: translateY(100%); transition: transform 300ms var(--ease-standard);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.sheet.open { transform: translateY(0); }
.sheet-handle { width: 36px; height: 4px; border-radius: var(--radius-full); background: var(--border-strong); margin: 10px auto 6px; flex: 0 0 auto; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 18px 12px; flex: 0 0 auto; border-bottom: 1px solid var(--divider); }
.sheet-header h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.sheet-body { padding: 14px 18px; overflow-y: auto; flex: 1 1 auto; }
.sheet-footer { padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0)); border-top: 1px solid var(--divider); flex: 0 0 auto; }

.modal-center-wrap { position: absolute; inset: 0; z-index: calc(var(--z-modal) + 1); display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-card {
  width: 100%; max-width: 320px; background: var(--surface); border-radius: var(--radius-lg); padding: 24px 22px;
  box-shadow: var(--shadow-lg); text-align: center; transform: scale(0.92) translateY(6px); opacity: 0; transition: all 240ms var(--ease-standard);
}
.modal-card.open { transform: scale(1) translateY(0); opacity: 1; }
.modal-icon { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }
.modal-icon svg { width: 26px; height: 26px; }
.modal-card h3 { font-size: 16.5px; font-weight: 700; margin-bottom: 7px; letter-spacing: -0.01em; }
.modal-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; }

/* ============ Toast ============ */
.toast-root { position: absolute; left: 0; right: 0; bottom: 90px; z-index: var(--z-toast); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast {
  display: flex; align-items: center; gap: 9px; background: #1D1F24; color: #fff; padding: 13px 17px;
  border-radius: var(--radius-md); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg);
  max-width: 340px; animation: toastIn 260ms var(--ease-standard);
}
.toast svg { width: 16px; height: 16px; flex: 0 0 auto; }
.toast.success { background: #14804A; }
.toast.error { background: var(--danger); }
.toast.info { background: #1D1F24; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }
.toast.leaving { animation: toastOut 200ms var(--ease-standard) forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

/* ============ Loading / skeleton ============ */
.loading-block { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 14px; color: var(--text-secondary); font-size: 13px; font-weight: 600; }
.spinner { display: inline-block; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--divider); border-top-color: var(--primary); animation: spin 700ms linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.overlay-loading { position: absolute; inset: 0; background: rgba(255,255,255,0.8); z-index: var(--z-sheet); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(1px); }
:root[data-theme="dark"] .overlay-loading { background: rgba(19,20,23,0.8); }

.skeleton { background: linear-gradient(90deg, var(--divider) 25%, var(--border) 37%, var(--divider) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
.sk-line { height: 12px; border-radius: 6px; margin-bottom: 8px; }
.sk-card { height: 84px; border-radius: var(--radius-lg); margin-bottom: 12px; }

/* ============ Empty / error state ============ */
.state-block { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 54px 24px; gap: 6px; }
.state-block .state-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; color: var(--muted); }
.state-block .state-icon svg { width: 30px; height: 30px; }
.state-block h4 { font-size: var(--text-md); font-weight: 700; color: var(--text); }
.state-block p { font-size: 13px; color: var(--text-secondary); max-width: 260px; line-height: 1.55; }
.state-block .btn { width: auto; margin-top: 16px; padding: 0 22px; }

/* ============ Splash ============ */
.splash { position: absolute; inset: 0; background: linear-gradient(165deg, var(--primary) 0%, var(--primary-dark) 62%, var(--primary-darker) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; z-index: 999; }
.splash-logo { width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; margin-bottom: 22px; animation: pulseLogo 2.2s ease-in-out infinite; filter: drop-shadow(0 12px 24px rgba(0,0,0,0.3)); }
.splash-logo svg { width: 96px; height: 96px; }
@keyframes pulseLogo { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
.splash h1 { font-size: 23px; font-weight: 800; letter-spacing: -0.01em; }
.splash .tag { font-size: 12.5px; opacity: 0.85; margin-top: 5px; letter-spacing: 0.01em; }
.splash .dots { display: flex; gap: 6px; margin-top: 36px; }
.splash .dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.55); animation: dotFade 1.1s ease-in-out infinite; }
.splash .dots span:nth-child(2) { animation-delay: 0.15s; }
.splash .dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes dotFade { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
.splash .version { position: absolute; bottom: 30px; font-size: 11px; opacity: 0.7; }

/* ============ Login ============ */
.login-screen { padding: 44px 26px 26px; display: flex; flex-direction: column; min-height: 100%; }
.login-logo { width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--primary); }
.login-logo svg { width: 68px; height: 68px; }
.login-logo:has(svg[viewBox="0 0 64 64"]) { filter: drop-shadow(0 6px 14px rgba(194,53,40,0.28)); }
.login-screen h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.login-screen .sub { font-size: 13px; color: var(--text-secondary); margin: 5px 0 30px; }
.login-error-banner { display: flex; gap: 8px; align-items: flex-start; background: var(--danger-light); color: var(--danger); padding: 13px 15px; border-radius: var(--radius-md); font-size: 12.5px; font-weight: 600; margin-bottom: 16px; }
.login-error-banner svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; }
.demo-hint { background: var(--surface-alt); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); padding: 11px 13px; font-size: 11.5px; color: var(--text-secondary); margin-top: 20px; line-height: 1.65; }
.login-footer { margin-top: auto; text-align: center; font-size: 11px; color: var(--muted); padding-top: 22px; }
.forgot-link { text-align: right; margin: -6px 0 18px; }
.forgot-link button { font-size: 12.5px; font-weight: 700; color: var(--primary); }

/* ============ Greeting header block ============ */
.greeting-block { padding: 4px 2px 6px; }
.greeting-block h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
.greeting-block .role-line { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }

/* ============ Charts (lightweight inline SVG) ============ */
.chart-card .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.chart-legend .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-secondary); font-weight: 600; }
.chart-legend .leg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
.bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
.bar-chart .bar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.bar-chart .bar { width: 100%; max-width: 22px; border-radius: 4px 4px 0 0; background: var(--primary); min-height: 3px; }
.bar-chart .bar-label { font-size: 9.5px; color: var(--muted); font-weight: 600; }

/* ============ Stepper (indent flow) ============ */
.stepper { display: flex; align-items: center; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.stepper .step { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1 1 0; position: relative; }
.stepper .step .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--divider); color: var(--muted); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 1; transition: background 200ms var(--ease-standard), color 200ms var(--ease-standard); }
.stepper .step.done .dot { background: var(--success); color: #fff; }
.stepper .step.active .dot { background: var(--primary); color: #fff; box-shadow: 0 0 0 4px var(--primary-light); }
.stepper .step .lbl { font-size: 9.5px; font-weight: 700; color: var(--muted); text-align: center; }
.stepper .step.active .lbl { color: var(--primary); }
.stepper .step:not(:last-child)::after { content: ''; position: absolute; top: 12px; left: 58%; width: 84%; height: 2px; background: var(--divider); }
.stepper .step.done:not(:last-child)::after { background: var(--success); }

/* qty stepper control */
.qty-stepper { display: flex; align-items: center; gap: 10px; }
.qty-stepper button { width: 34px; height: 34px; border-radius: var(--radius-md); background: var(--surface-alt); border: 1.5px solid var(--border); font-size: 17px; font-weight: 700; color: var(--primary); display: flex; align-items: center; justify-content: center; }
.qty-stepper button:disabled { opacity: 0.4; }
.qty-stepper input { width: 50px; height: 34px; text-align: center; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 14px; font-weight: 700; }

.product-pick-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--divider); }
.product-pick-row:last-child { border-bottom: none; }
.product-pick-row .p-name { font-size: 13.5px; font-weight: 700; }
.product-pick-row .p-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

.swipe-row { position: relative; overflow: hidden; border-radius: var(--radius-md); }
.swipe-row .swipe-del { position: absolute; right: 0; top: 0; bottom: 0; width: 64px; background: var(--danger); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

.timeline { position: relative; padding-left: 22px; }
.timeline-item { position: relative; padding-bottom: 22px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before { content: ''; position: absolute; left: -22px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--divider); border: 2px solid var(--surface); }
.timeline-item.done::before { background: var(--success); }
.timeline-item.active::before { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.timeline-item::after { content: ''; position: absolute; left: -18px; top: 13px; bottom: -10px; width: 2px; background: var(--divider); }
.timeline-item:last-child::after { display: none; }
.timeline-item .t-title { font-size: 13px; font-weight: 700; }
.timeline-item .t-time { font-size: 11px; color: var(--muted); margin-top: 2px; }

.list-item-link { display: flex; align-items: center; justify-content: space-between; padding: 15px 16px; background: var(--surface); border-bottom: 1px solid var(--divider); }
.list-item-link:active { background: var(--surface-alt); }
.list-item-link .li-label { font-size: 14px; font-weight: 600; }
.list-item-link svg.chev { width: 18px; height: 18px; color: var(--muted); }

.switch { display: inline-block; position: relative; width: 44px; height: 26px; border-radius: var(--radius-full); background: var(--divider); flex: 0 0 auto; transition: background 180ms var(--ease-standard); }
.switch.on { background: var(--primary); }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform 180ms var(--ease-spring); }
.switch.on .knob { transform: translateX(18px); }

.avatar-lg { width: 78px; height: 78px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; margin: 0 auto; box-shadow: 0 0 0 4px var(--surface), 0 8px 20px rgba(194,53,40,0.16); }
.profile-header { text-align: center; padding: 28px 20px; background: var(--surface); border-bottom: 8px solid var(--background); }
.profile-header .p-name { font-size: 17.5px; font-weight: 800; margin-top: 14px; letter-spacing: -0.01em; }
.profile-header .p-role { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; }
.profile-header .p-id { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Real phones: fill the viewport, drop the device chrome (and the preview switcher — a real
   device doesn't need a control for picking which real device it is). */
@media (max-width: 480px), (pointer: coarse) and (max-width: 900px) {
  body { background: var(--background); }
  .preview-toolbar { display: none; }
  .device-frame { padding: 0; min-height: 100vh; min-height: 100dvh; }
  .device-screen {
    width: 100vw; height: 100vh; height: 100dvh; max-height: none;
    border-radius: 0; box-shadow: none;
  }
}

/* Alternate reference viewports: 375x812 / 412x915 / 430x932 all flex-scale within the frame naturally */
@media (min-width: 481px) and (max-height: 700px) {
  .device-screen { height: 92vh; }
}

/* Small mobile: tighten spacing/grids so nothing crowds a narrow 320-359px screen */
@media (max-width: 359px) {
  .screen-body { padding: 13px 13px 24px; }
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .quick-actions { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .btn { font-size: 13.5px; padding: 0 14px; }
  .app-header-title { font-size: 15.5px; }
}

/* Large mobile / small tablet edge (431-767): a little extra breathing room */
@media (min-width: 431px) and (max-width: 767px) {
  .screen-body { padding: 18px 20px 30px; }
}

/* ---------- App chrome: navigation rail (tablet only) ----------
   Mobile navigates via the drawer only, same as the original design. The rail element exists in
   the DOM permanently (see index.html) but stays empty/hidden until app-nav.js detects a "main
   app" route (post-login, post-onboarding) and populates it — tablet-only, see below. */
.nav-rail { display: none; }

/* ---------- Tablet mode: bigger desktop-preview frame ----------
   Scoped to fine-pointer/wide contexts only, so a real small coarse-pointer device still
   gets the full-viewport phone treatment above regardless of the chosen app mode. */
@media (pointer: fine), (min-width: 901px) {
  [data-device="tablet"] .device-screen { width: 834px; height: 1112px; }
}

/* Tablet mode fills a real tablet's screen edge to edge, same as phone mode does for phones. */
@media (pointer: coarse) and (min-width: 700px) {
  [data-device="tablet"] .preview-toolbar { display: none; }
  [data-device="tablet"] .device-screen {
    width: 100vw; height: 100vh; height: 100dvh; max-height: none;
    border-radius: 0; box-shadow: none;
  }
}

/* Tablet: show the persistent navigation rail, and let the app content area use the extra
   width via wider list/grid layouts below. */
[data-device="tablet"][data-app-chrome="1"] .nav-rail { display: flex; }

/* Tablet mode: wider multi-column layouts for list-style screens, matching a real tablet idiom. */
[data-device="tablet"] #in-list,
[data-device="tablet"] #mt-list,
[data-device="tablet"] #pt-list,
[data-device="tablet"] #activity-list,
[data-device="tablet"] #outstanding-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: start;
}
/* Only .card children join the 2-column flow — everything else (search bars, section
   titles, empty states) spans the full width above/between them. */
[data-device="tablet"] #in-list > *,
[data-device="tablet"] #mt-list > *,
[data-device="tablet"] #pt-list > *,
[data-device="tablet"] #activity-list > *,
[data-device="tablet"] #outstanding-list > * {
  grid-column: 1 / -1;
}
[data-device="tablet"] #in-list > .card,
[data-device="tablet"] #mt-list > .card,
[data-device="tablet"] #pt-list > .card,
[data-device="tablet"] #activity-list > .card,
[data-device="tablet"] #outstanding-list > .card {
  grid-column: auto;
  margin-top: 0;
}
/* #ai-content (Account Info) is deliberately separate: it holds anywhere from 1 card (a single
   dense fact-sheet) to 6+ short cards (Invoice/Transaction Details) depending on which tab is
   active, all through the same container. A fixed column count either wastes space or squeezes
   a lone fact-sheet card into a too-narrow column (causing text to wrap unnecessarily) — auto-fit
   sizes each card by content instead, giving 1-2 cards full/half width and letting many short
   cards naturally flow into 2-3 columns once there's room. */
[data-device="tablet"] #ai-content {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 12px;
  align-items: start;
}
[data-device="tablet"] #ai-content > * { grid-column: 1 / -1; }
[data-device="tablet"] #ai-content > .card { grid-column: auto; margin-top: 0; }
[data-device="tablet"] .login-screen {
  max-width: 480px;
  margin: 0 auto;
}

/* Tablet: dense label/value fact-sheet cards (RO Details) flow into two balanced columns instead
   of one long stretched column of thin rows. Only kicks in once a card has at least 4 rows — a
   short 2-row card (e.g. the sync-progress checklist) has nothing to gain from being split and
   looks broken split in half, so it's left single-column. Explicitly excludes #ai-content cards —
   those are ALREADY split into side-by-side cards by the grid two rules below, so adding a second,
   inner column split on top of that produced columns so narrow that text wrapped letter-by-letter. */
@media (min-width: 700px) {
  [data-device="tablet"] .card:has(> .stat-row ~ .stat-row ~ .stat-row ~ .stat-row):not(#ai-content .card) {
    column-count: 2;
    column-gap: 28px;
  }
  [data-device="tablet"] .card:has(> .stat-row ~ .stat-row ~ .stat-row ~ .stat-row):not(#ai-content .card) > .stat-row {
    break-inside: avoid;
  }

  /* Tablet: audit-form field cards (RO Audit Forms sections) lay their inputs out two-up
     instead of one long column of full-width fields; any non-field child (e.g. a repeat-nav
     prev/next header) still spans the full card width. Same 4-field minimum as above. */
  [data-device="tablet"] #sec-body .card:has(> .field ~ .field ~ .field ~ .field) {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 20px;
    row-gap: 4px;
    align-items: start;
  }
  [data-device="tablet"] #sec-body .card:has(> .field ~ .field ~ .field ~ .field) > * { grid-column: 1 / -1; }
  [data-device="tablet"] #sec-body .card:has(> .field ~ .field ~ .field ~ .field) > .field { grid-column: auto; margin-bottom: 0 !important; }
}

/* Tablet portrait vs landscape: widen the content ceiling further in landscape so cards/grids
   don't over-stretch into uncomfortable line lengths. */
@media (min-width: 900px) {
  [data-device="tablet"] .screen-body { padding: 24px 32px 32px; max-width: 900px; margin: 0 auto; width: 100%; }
  [data-device="tablet"] .kpi-grid,
  [data-device="tablet"] .quick-actions { max-width: 900px; margin-left: auto; margin-right: auto; }
}
@media (min-width: 900px) and (min-aspect-ratio: 4/3) {
  [data-device="tablet"] #in-list,
  [data-device="tablet"] #mt-list,
  [data-device="tablet"] #pt-list,
  [data-device="tablet"] #activity-list,
  [data-device="tablet"] #outstanding-list {
    grid-template-columns: 1fr 1fr 1fr;
  }
}

/* ---------- Tablet: typography/icon upscale ----------
   Layout alone (columns, grids) isn't enough to make tablet feel designed-for-tablet — text and
   icons were staying at mobile pixel sizes, just spread across a wider canvas. This bumps the
   most-used, most-visible classes ~10-15% and gives cards a bit more breathing room. Additive
   only: mobile is untouched, nothing here changes layout/structure, only size/spacing. */
@media (min-width: 700px) {
  [data-device="tablet"] .icon-btn svg { width: 24px; height: 24px; }
  [data-device="tablet"] .nav-rail-item svg { width: 24px; height: 24px; }
  [data-device="tablet"] .nav-rail-item { font-size: 11.5px; }
  [data-device="tablet"] .drawer-nav-item svg { width: 22px; height: 22px; }
  [data-device="tablet"] .drawer-nav-item { font-size: 15.5px; }
  [data-device="tablet"] .app-header-title { font-size: 19px; }

  [data-device="tablet"] .card { padding: 20px; }
  [data-device="tablet"] .section-title { font-size: 13.5px; }
  [data-device="tablet"] .o-code { font-size: 12.5px; }
  [data-device="tablet"] .stat-row .s-label { font-size: 14.5px; }
  [data-device="tablet"] .stat-row .s-value { font-size: 15.5px; }
  [data-device="tablet"] .stat-row { padding: 14px 0; }

  [data-device="tablet"] .field label { font-size: 13.5px; }
  [data-device="tablet"] .input, [data-device="tablet"] select.input { height: 52px; font-size: 15.5px; }
  [data-device="tablet"] .btn { height: 52px; font-size: 15.5px; }
  [data-device="tablet"] .chip, [data-device="tablet"] .tab-btn { font-size: 13.5px; padding-top: 9px; padding-bottom: 9px; }
  [data-device="tablet"] .badge { font-size: 11.5px; padding: 4px 11px; }

  [data-device="tablet"] .kpi-card .kpi-value { font-size: 22px; }
  [data-device="tablet"] .kpi-card .kpi-label { font-size: 12.5px; }
  [data-device="tablet"] .greeting-block h2 { font-size: 21px; }

  [data-device="tablet"] .indent-status-step { font-size: 12.5px; }
  [data-device="tablet"] .indent-status-step svg { width: 20px; height: 20px; }
  [data-device="tablet"] .outlet-card .o-name { font-size: 16px; }
}

</style>

Modules['state'] = (function () {
const appState = {
  deviceMode: null, // 'mobile' | 'tablet' — set from the external preview toolbar, outside the app
  user: null,
  role: null, // 'TSM' | 'HOS' (non-TSM manager roles)
  otpVerified: false,
  syncCompleted: false,
  selectedTsmId: null, // which TSM's outlets a manager is reviewing (self, if role === 'TSM')
  trackerMode: null, // 'monthly' | 'cra' — chosen on TrackerSelection screen
  selectedOutletId: null,
  currentCra: null, // { id, outletId, outletName, responses: {}, progress: {} } — the CRA being edited
  currentTracker: null, // { outletId, answers: {} } — the Monthly Tracker form being edited
  currentRoute: '',
};

const listeners = new Set();

function setState(patch) {
  Object.assign(appState, patch);
  listeners.forEach((fn) => fn(appState));
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

const SESSION_KEY = 'mmg.session';

function persistSession() {
  const payload = JSON.stringify({
    userId: appState.user.id,
    otpVerified: appState.otpVerified,
    syncCompleted: appState.syncCompleted,
    selectedTsmId: appState.selectedTsmId,
    trackerMode: appState.trackerMode,
  });
  sessionStorage.setItem(SESSION_KEY, payload);
}

function loadPersistedSession() {
  const raw = sessionStorage.getItem(SESSION_KEY);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
}

const DEVICE_MODE_KEY = 'mmg.deviceMode';

function loadPersistedDeviceMode() {
  return localStorage.getItem(DEVICE_MODE_KEY);
}

function setDeviceMode(mode) {
  localStorage.setItem(DEVICE_MODE_KEY, mode);
  document.documentElement.setAttribute('data-device', mode);
  setState({ deviceMode: mode });
}

return {appState, setState, subscribe, persistSession, loadPersistedSession, clearSession, loadPersistedDeviceMode, setDeviceMode};
})();

Modules['mock-api'] = (function () {
// Promise-based mock network layer for the Mount Meru flow-verification prototype.
// No validation/business-rule gating lives here by design — every call resolves so the full
// navigation flow can be walked end to end. Swap these for real endpoints later; every screen only
// talks to the app through this file.
const {USERS, TSM_ROSTER, OUTLETS, CRA_ACTIVITIES, CRA_DRAFTS, CRA_SUBMITTED, MONTHLY_TRACKER_QUESTIONS, MONTHLY_TRACKER_RECORDS, INDENTS, ACCOUNT_INFO, OUTSTANDING_AMOUNTS} = Modules['data'];
const {appState} = Modules['state'];

const LATENCY = [300, 650];
function delay() { return new Promise((res) => setTimeout(res, LATENCY[0] + Math.random() * (LATENCY[1] - LATENCY[0]))); }
async function call(fn) { await delay(); return fn(); }

function tsmOutlets(tsmId) {
  return OUTLETS.filter((o) => o.tsmId === tsmId);
}

const mockApi = {
  login(employeeId) {
    return call(() => {
      const user = USERS.find((u) => u.id === employeeId.trim());
      if (!user) throw new Error('Employee ID not found. Try the demo IDs shown below.');
      return { ...user };
    });
  },

  verifyOtp() { return call(() => true); },
  resendOtp() { return call(() => true); },

  syncMasterData() {
    return call(() => ({ tsmCount: TSM_ROSTER.length, outletCount: OUTLETS.length }));
  },
  syncMonthlyTrackerData() {
    return call(() => ({ recordCount: MONTHLY_TRACKER_RECORDS.length }));
  },

  getTsmRoster() { return call(() => TSM_ROSTER); },

  getOutlets() {
    return call(() => {
      const tsmId = appState.role === 'TSM' ? appState.user.id : appState.selectedTsmId;
      return tsmOutlets(tsmId);
    });
  },

  getOutlet(id) {
    return call(() => OUTLETS.find((o) => o.id === id) || null);
  },

  getDashboardData() {
    return call(() => {
      const outlets = appState.role === 'TSM' ? tsmOutlets(appState.user.id) : tsmOutlets(appState.selectedTsmId);
      const months = ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'];
      const previous = months.map(() => Math.round(300 + Math.random() * 200));
      const actual = months.map((v, i) => Math.round(previous[i] * (0.85 + Math.random() * 0.3)));
      const outstanding = OUTSTANDING_AMOUNTS.filter((o) => outlets.some((x) => x.id === o.outletId));
      return {
        outlets, months, previous, actual,
        previousYearTotal: previous.reduce((s, v) => s + v, 0),
        actualTotal: actual.reduce((s, v) => s + v, 0),
        outstanding,
        totalOutstanding: outstanding.reduce((s, o) => s + o.outAmountPay, 0),
        fuelStatus: {
          MS: { stockOut: outlets.filter((o, i) => i % 6 === 0).length, belowSafety: outlets.filter((o, i) => i % 5 === 0).length },
          HSD: { stockOut: outlets.filter((o, i) => i % 7 === 0).length, belowSafety: outlets.filter((o, i) => i % 4 === 0).length },
        },
      };
    });
  },

  getCraActivities() { return call(() => CRA_ACTIVITIES); },

  getCraDrafts() {
    return call(() => {
      const outlets = appState.role === 'TSM' ? tsmOutlets(appState.user.id) : tsmOutlets(appState.selectedTsmId);
      return CRA_DRAFTS.filter((c) => outlets.some((o) => o.id === c.outletId));
    });
  },

  getCraSubmitted() {
    return call(() => {
      const outlets = appState.role === 'TSM' ? tsmOutlets(appState.user.id) : tsmOutlets(appState.selectedTsmId);
      return CRA_SUBMITTED.filter((c) => outlets.some((o) => o.id === c.outletId));
    });
  },

  createCraDraft({ outletId }) {
    return call(() => {
      const outlet = OUTLETS.find((o) => o.id === outletId);
      const progress = {};
      CRA_ACTIVITIES.forEach((a) => { progress[a.key] = 0; });
      const draft = { id: Date.now(), outletId, outletName: outlet.name, date: '2026-08-24', time: '10:00:00', progress, responses: {} };
      CRA_DRAFTS.unshift(draft);
      return draft;
    });
  },

  getCraDraft(id) {
    return call(() => CRA_DRAFTS.find((c) => c.id === id) || null);
  },

  getPrevCraInfo(outletId) {
    return call(() => CRA_SUBMITTED.find((c) => c.outletId === outletId) ? { found: true, date: '2026-07-18' } : { found: false });
  },

  saveCraSection({ craId, sectionKey, responses }) {
    return call(() => {
      const draft = CRA_DRAFTS.find((c) => c.id === craId);
      if (!draft) return null;
      draft.responses[sectionKey] = responses;
      draft.progress[sectionKey] = 100;
      return draft;
    });
  },

  submitCra({ craId }) {
    return call(() => {
      const idx = CRA_DRAFTS.findIndex((c) => c.id === craId);
      if (idx === -1) return null;
      const draft = CRA_DRAFTS[idx];
      CRA_DRAFTS.splice(idx, 1);
      const submitted = { id: `AUD-${9100 + CRA_SUBMITTED.length}`, outletId: draft.outletId, outletName: draft.outletName, date: '2026-08-24', submittedBy: appState.user?.name || 'Unknown' };
      CRA_SUBMITTED.unshift(submitted);
      return submitted;
    });
  },

  deleteCraDraft({ craId }) {
    return call(() => {
      const idx = CRA_DRAFTS.findIndex((c) => c.id === craId);
      if (idx > -1) CRA_DRAFTS.splice(idx, 1);
      return true;
    });
  },

  getMonthlyTrackerQuestions() { return call(() => MONTHLY_TRACKER_QUESTIONS); },

  getMonthlyTrackerList() {
    return call(() => {
      const outlets = appState.role === 'TSM' ? tsmOutlets(appState.user.id) : tsmOutlets(appState.selectedTsmId);
      return MONTHLY_TRACKER_RECORDS.filter((r) => outlets.some((o) => o.id === r.outletId));
    });
  },

  getMonthlyTrackerForm(outletId) {
    return call(() => MONTHLY_TRACKER_RECORDS.find((r) => r.outletId === outletId) || null);
  },

  submitMonthlyTracker({ outletId, answers }) {
    return call(() => {
      const rec = MONTHLY_TRACKER_RECORDS.find((r) => r.outletId === outletId);
      if (!rec) return null;
      rec.answers = answers;
      const answeredYes = Object.values(answers).filter(Boolean).length;
      rec.percentage = Math.round((Object.keys(answers).length / MONTHLY_TRACKER_QUESTIONS.length) * 100);
      rec.completed = rec.percentage === 100;
      return rec;
    });
  },

  getPendingTasks() {
    return call(() => {
      const outlets = appState.role === 'TSM' ? tsmOutlets(appState.user.id) : tsmOutlets(appState.selectedTsmId);
      return MONTHLY_TRACKER_RECORDS
        .filter((r) => outlets.some((o) => o.id === r.outletId) && r.percentage < 100)
        .sort((a, b) => a.outletId.localeCompare(b.outletId));
    });
  },

  getIndents() {
    return call(() => {
      const outlets = appState.role === 'TSM' ? tsmOutlets(appState.user.id) : tsmOutlets(appState.selectedTsmId);
      return INDENTS.filter((i) => outlets.some((o) => o.id === i.outletId)).map((i) => ({ ...i, outletName: outlets.find((o) => o.id === i.outletId)?.name }));
    });
  },

  getAccountInfo(outletId) {
    return call(() => ACCOUNT_INFO[outletId] || null);
  },
};

return {mockApi};
})();

Modules['components/toast'] = (function () {
const {icons} = Modules['components/icons'];

const iconFor = { success: icons.checkCircle, error: icons.xCircle, info: icons.info };

function showToast(message, type = 'info', duration = 2600) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.setAttribute('role', 'status');
  el.innerHTML = `${iconFor[type] || iconFor.info}<span>${message}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  }, duration);
}

return {showToast};
})();

Modules['components/modal'] = (function () {
const {icons} = Modules['components/icons'];

const overlayRoot = () => document.getElementById('overlay-root');

function closeAllOverlays() {
  const root = overlayRoot();
  if (root) root.innerHTML = '';
}

function openSheet({ title, bodyHtml, footerHtml = '', onMount, onClose }) {
  const root = overlayRoot();
  root.innerHTML = `
    <div class="overlay-backdrop" id="sheet-backdrop"></div>
    <div class="sheet" id="sheet-el" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3>${title}</h3>
        <button class="icon-btn" id="sheet-close-btn" style="color:var(--text-secondary)" aria-label="Close">${icons.close}</button>
      </div>
      <div class="sheet-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="sheet-footer">${footerHtml}</div>` : ''}
    </div>`;
  requestAnimationFrame(() => {
    root.querySelector('#sheet-backdrop').classList.add('open');
    root.querySelector('#sheet-el').classList.add('open');
  });
  const close = () => {
    root.querySelector('#sheet-backdrop')?.classList.remove('open');
    root.querySelector('#sheet-el')?.classList.remove('open');
    setTimeout(() => { root.innerHTML = ''; onClose?.(); }, 220);
  };
  root.querySelector('#sheet-backdrop').addEventListener('click', close);
  root.querySelector('#sheet-close-btn').addEventListener('click', close);
  if (onMount) onMount(root.querySelector('#sheet-el'), close);
  return close;
}

function openConfirm({ iconName = 'alertCircle', iconClass = 'badge-warning', title, message, confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false, onConfirm, onCancel }) {
  const root = overlayRoot();
  root.innerHTML = `
    <div class="overlay-backdrop" id="modal-backdrop"></div>
    <div class="modal-center-wrap">
      <div class="modal-card" id="modal-card" role="alertdialog" aria-modal="true">
        <div class="modal-icon ${iconClass}">${icons[iconName]}</div>
        <h3>${title}</h3>
        <p>${message}</p>
        <div class="modal-actions">
          <button class="btn btn-outline" id="modal-cancel-btn">${cancelLabel}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="modal-confirm-btn">${confirmLabel}</button>
        </div>
      </div>
    </div>`;
  requestAnimationFrame(() => {
    root.querySelector('#modal-backdrop').classList.add('open');
    root.querySelector('#modal-card').classList.add('open');
  });
  const close = () => {
    root.querySelector('#modal-backdrop')?.classList.remove('open');
    root.querySelector('#modal-card')?.classList.remove('open');
    setTimeout(() => { root.innerHTML = ''; }, 180);
  };
  root.querySelector('#modal-backdrop').addEventListener('click', close);
  root.querySelector('#modal-cancel-btn').addEventListener('click', () => { close(); onCancel?.(); });
  root.querySelector('#modal-confirm-btn').addEventListener('click', () => { close(); onConfirm?.(); });
  return close;
}

function showLoadingOverlay(container, text = 'Loading...') {
  const el = document.createElement('div');
  el.className = 'overlay-loading';
  el.id = 'inline-loading-overlay';
  el.innerHTML = `<div class="loading-block"><div class="spinner"></div><span>${text}</span></div>`;
  container.appendChild(el);
  return () => el.remove();
}

return {closeAllOverlays, openSheet, openConfirm, showLoadingOverlay};
})();

Modules['components/capture'] = (function () {

// Mock camera capture: real camera access needs getUserMedia + device permission, which can't be
// verified/exercised in this prototype context, so we render a viewfinder-style placeholder and
// generate a stand-in photo via canvas. Swap the capture step for a real camera call later.
function generatePlaceholderPhoto(label) {
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 220;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 320, 220);
  grad.addColorStop(0, '#D0111B'); grad.addColorStop(1, '#7a0c12');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 320, 220);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = '600 14px Inter, sans-serif';
  ctx.fillText(label, 16, 26);

Modules['components/signature'] = (function () {
const {openSheet} = Modules['components/modal'];

// Lightweight signature pad: draw on canvas, "Use Signature" returns a dataURL. No validation —
// an empty pad still returns whatever was drawn (even nothing) since this is flow-only.
function openSignaturePad({ title = 'Signature', onSign }) {
  openSheet({
    title,
    bodyHtml: `<canvas id="sig-canvas" style="width:100%;height:180px;background:var(--surface-alt);border-radius:var(--radius-md);border:1.5px dashed var(--border);touch-action:none;"></canvas>
      <p style="text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px;">Draw your signature above</p>`,
    footerHtml: `<div style="display:flex;gap:10px;"><button class="btn btn-outline" id="sig-clear">Clear</button><button class="btn btn-primary" id="sig-use">Use Signature</button></div>`,
    onMount: (el, close) => {
      const canvas = el.querySelector('#sig-canvas');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.strokeStyle = '#1A1D24'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      let drawing = false;
      const pos = (e) => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      };
      const start = (e) => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
      const move = (e) => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
      const end = () => { drawing = false; };
      canvas.addEventListener('pointerdown', start);
      canvas.addEventListener('pointermove', move);
      window.addEventListener('pointerup', end);

      el.querySelector('#sig-clear').addEventListener('click', () => ctx.clearRect(0, 0, canvas.width, canvas.height));
      el.querySelector('#sig-use').addEventListener('click', () => {
        const dataUrl = canvas.toDataURL('image/png');
        close();
        onSign?.(dataUrl);
      });
    },
  });
}

return {openSignaturePad};
})();

Modules['components/app-nav'] = (function () {
const {icons} = Modules['components/icons'];
const {appState, subscribe} = Modules['state'];
const {DRAWER_ITEMS} = Modules['components/navigation'];

// Persistent app-chrome: a navigation rail on tablet (mobile navigates via the drawer only, same
// as before). Reuses the exact same route/label/icon data as the drawer (navigation.js) — no new
// labels are introduced. Not touched by the router (it only ever clears/fills #app.app-root), so
// this module owns its own re-render, driven by the same state.currentRoute the router already sets.

const CHROME_ROUTES = DRAWER_ITEMS.map((it) => it.route);

function isChromeRoute(path) {
  return CHROME_ROUTES.some((r) => path === r || path.startsWith(`${r}/`));
}
function isActive(route) {
  const cur = appState.currentRoute || '';
  return cur === route || cur.startsWith(`${route}/`);
}
function navigate(path) {
  if (location.hash.slice(1) === path) return;
  location.hash = path;
}

function navRailHtml() {
  return `
    <div class="nav-rail-brand">${icons.meruLogo}</div>
    ${DRAWER_ITEMS.map((it) => `
      <a href="#${it.route}" class="nav-rail-item ${isActive(it.route) ? 'active' : ''}" data-route="${it.route}">
        ${icons[it.icon]}<span>${it.label}</span>
      </a>`).join('')}
  `;
}

function initAppNav() {
  const navRailEl = document.getElementById('nav-rail');
  if (!navRailEl) return;

  function attachClicks(root) {
    root.querySelectorAll('[data-route]').forEach((el) => {
      el.addEventListener('click', (e) => { e.preventDefault(); navigate(el.dataset.route); });
    });
  }

  function render() {
    const path = appState.currentRoute || '';
    const show = isChromeRoute(path);
    document.documentElement.setAttribute('data-app-chrome', show ? '1' : '0');
    if (!show) { navRailEl.innerHTML = ''; return; }
    navRailEl.innerHTML = navRailHtml();
    attachClicks(navRailEl);
  }

  subscribe(render);
  render();
}

return {initAppNav};
})();

Modules['screens/dashboard'] = (function () {
const {mountScreen} = Modules['components/shell'];
const {mockApi} = Modules['mock-api'];
const {icons} = Modules['components/icons'];
const {skeletonList, errorState} = Modules['components/skeleton'];
const {showToast} = Modules['components/toast'];

// Smooth curve through points via midpoint-control cubic beziers (lightweight Catmull-Rom stand-in).
function smoothPath(points) {
  let d = `M ${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
  for (let i = 0; i < points.length - 1; i++) {
    const [x0, y0] = points[i];
    const [x1, y1] = points[i + 1];
    const mx = (x0 + x1) / 2;
    d += ` C ${mx.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return d;
}

function liquidGauge(pct, color) {
  const p = Math.max(4, Math.min(94, pct));
  const fillY = 58 - (p / 100) * 52;
  return `<svg viewBox="0 0 60 60" style="width:66px;height:66px;flex:0 0 auto;">
    <defs><clipPath id="mm-gauge-clip"><circle cx="30" cy="30" r="26"/></clipPath></defs>
    <circle cx="30" cy="30" r="26" fill="var(--surface-alt)" stroke="${color}" stroke-width="2.5"/>
    <g clip-path="url(#mm-gauge-clip)">
      <rect x="0" y="${fillY.toFixed(1)}" width="60" height="60" fill="${color}" opacity="0.82"/>
      <path d="M0,${fillY.toFixed(1)} Q15,${(fillY - 3.5).toFixed(1)} 30,${fillY.toFixed(1)} T60,${fillY.toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.6" opacity="0.9"/>
    </g>
  </svg>`;
}

function render(container) {
  const body = mountScreen(container, {
    header: { title: 'Dashboard', showMenu: true, showProfile: true },
    bodyHtml: `
      <div class="field" style="margin-bottom:10px;">
        <select class="input" id="ro-picker"><option>All Retail Outlets</option></select>
      </div>
      <div class="search-row" style="margin-bottom:10px;gap:8px;">
        <input class="input" type="month" id="from-month" value="2026-03" style="flex:1;min-width:0;padding:0 8px;" title="From" />
        <input class="input" type="month" id="to-month" value="2026-08" style="flex:1;min-width:0;padding:0 8px;" title="To" />
        <button class="filter-btn" id="go-btn" title="GO" style="flex:0 0 auto;">${icons.refresh}</button>
      </div>
      <button class="btn btn-outline" id="sync-data-btn" style="margin-bottom:14px;color:var(--success);border-color:var(--success);">${icons.refresh} Sync Data</button>
      <div id="dash-content">${skeletonList(3)}</div>
    `,
  });

  container.querySelector('#go-btn').addEventListener('click', () => loadDashboard(body));
  container.querySelector('#sync-data-btn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    if (btn.disabled) return;
    btn.disabled = true;
    await mockApi.syncMasterData();
    showToast('Data synced', 'success');
    btn.disabled = false;
    loadDashboard(body);
  });
  loadDashboard(body);
}

let fuelView = 'MS';

async function loadDashboard(body) {
  const content = body.querySelector('#dash-content');
  content.innerHTML = skeletonList(3);
  try {
    const d = await mockApi.getDashboardData();

    const roSelect = body.querySelector('#ro-picker');
    if (roSelect.options.length <= 1) {
      roSelect.innerHTML = `<option value="">All Retail Outlets</option>` + d.outlets.map((o) => `<option value="${o.id}">${o.name}</option>`).join('');
    }

    const maxVal = Math.max(...d.previous, ...d.actual, 1);
    const W = 300, H = 116, PAD = 6;
    const n = d.months.length;
    const xStep = n > 1 ? (W - PAD * 2) / (n - 1) : 0;
    const toY = (v) => H - PAD - (v / maxVal) * (H - PAD * 2);
    const prevPts = d.previous.map((v, i) => [PAD + i * xStep, toY(v)]);
    const actualPts = d.actual.map((v, i) => [PAD + i * xStep, toY(v)]);

    const fuelColor = fuelView === 'MS' ? 'var(--primary)' : 'var(--success)';
    const fuelPrevYear = Math.round(d.previousYearTotal * (fuelView === 'MS' ? 0.55 : 0.45));
    const fuelActual = Math.round(d.actualTotal * (fuelView === 'MS' ? 0.55 : 0.45));
    const gaugePct = Math.round((fuelActual / (fuelPrevYear + fuelActual || 1)) * 100);

    content.innerHTML = `
      <div class="section-title" style="margin-top:0;">All Retail Outlet — Sales Trend</div>
      <div class="card chart-card">
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:116px;display:block;">
          <path d="${smoothPath(prevPts)}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${smoothPath(actualPts)}" fill="none" stroke="var(--accent-dark)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="display:flex;justify-content:space-between;margin-top:2px;">
          ${d.months.map((m) => `<span class="bar-label">${m}</span>`).join('')}
        </div>
        <div class="chart-legend">
          <span class="leg-item"><span class="leg-dot" style="background:var(--primary);border-radius:50%;"></span>Previous</span>
          <span class="leg-item"><span class="leg-dot" style="background:var(--accent-dark);border-radius:50%;"></span>Actual</span>
        </div>
      </div>

      <div class="section-title">Sales Breakup (Qty)</div>
      <div class="chip-row" style="margin-bottom:10px;">
        <button class="chip ${fuelView === 'MS' ? 'active' : ''}" id="fuel-ms">MS</button>
        <button class="chip ${fuelView === 'HSD' ? 'active' : ''}" id="fuel-hsd">HSD</button>
      </div>
      <div class="card" style="display:flex;align-items:center;gap:14px;">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;gap:8px;${fuelView === 'MS' ? 'opacity:1;' : 'opacity:0.55;'}">
            <span style="color:var(--primary);">${icons.fuel}</span>
            <div style="min-width:0;"><div style="font-size:12px;font-weight:800;color:var(--primary);">MS · ${d.fuelStatus.MS.stockOut} stock-out</div><div style="font-size:11px;color:var(--text-secondary);">outlet${d.fuelStatus.MS.stockOut === 1 ? '' : 's'}</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;${fuelView === 'HSD' ? 'opacity:1;' : 'opacity:0.55;'}">
            <span style="color:var(--success);">${icons.fuel}</span>
            <div style="min-width:0;"><div style="font-size:12px;font-weight:800;color:var(--success);">HSD · ${d.fuelStatus.HSD.belowSafety} below safety</div><div style="font-size:11px;color:var(--text-secondary);">level outlet${d.fuelStatus.HSD.belowSafety === 1 ? '' : 's'}</div></div>
          </div>
        </div>
        ${liquidGauge(gaugePct, fuelColor)}
        <div style="flex:0 0 auto;text-align:right;">
          <div style="font-size:10.5px;color:var(--info);font-weight:700;">PREVIOUS YEAR</div>
          <div style="font-size:16px;font-weight:800;margin-bottom:6px;">${fuelPrevYear} KL</div>
          <div style="font-size:10.5px;color:var(--success);font-weight:700;">ACTUAL SALES</div>
          <div style="font-size:16px;font-weight:800;">${fuelActual} KL</div>
        </div>
      </div>

      <div class="section-title">Total Outstanding Amount</div>
      <div class="card" style="background:#24262B;color:#fff;text-align:center;">
        <div style="font-size:22px;font-weight:800;">₹${d.totalOutstanding.toLocaleString('en-IN')}</div>
        <div style="font-size:12px;opacity:0.75;margin-top:4px;">${d.outstanding.length} outlet${d.outstanding.length === 1 ? '' : 's'} with pending balance</div>
      </div>

      <div id="outstanding-list" style="margin-top:12px;"></div>
    `;

    const listEl = content.querySelector('#outstanding-list');
    if (!d.outstanding.length) {
      listEl.innerHTML = `<div class="state-block"><p>No pending tasks.</p></div>`;
    } else {
      listEl.innerHTML = d.outstanding.map((o) => `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-weight:700;font-size:13.5px;">${o.custName}</div><div class="o-code">Account Balance</div></div>
          <div style="color:var(--danger);font-weight:800;">₹${o.outAmountPay.toLocaleString('en-IN')}</div>
        </div>`).join('');
    }

    content.querySelector('#fuel-ms').addEventListener('click', () => { fuelView = 'MS'; loadDashboard(body); });
    content.querySelector('#fuel-hsd').addEventListener('click', () => { fuelView = 'HSD'; loadDashboard(body); });
  } catch (err) {
    content.innerHTML = errorState({ message: 'Unable to load dashboard data.' });
    content.querySelector('#retry-btn').addEventListener('click', () => loadDashboard(body));
  }
}

return {render};
})();
