    footerHtml: `<div style="display:flex;gap:10px;"><button class="btn btn-outline" id="sync-cancel-btn">Cancel</button><button class="btn btn-primary" id="sync-confirm-btn">Sync</button></div>`,
    onMount: (el, close) => {
      el.querySelectorAll('[data-sync-outlet]').forEach((cb) => cb.addEventListener('change', () => {
        if (cb.checked) selected.add(cb.dataset.syncOutlet); else selected.delete(cb.dataset.syncOutlet);
      }));
      el.querySelector('#sync-cancel-btn').addEventListener('click', close);
      el.querySelector('#sync-confirm-btn').addEventListener('click', async () => {
        if (!selected.size) { close(); return; }
        const btn = el.querySelector('#sync-confirm-btn');
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Syncing...`;
        await Promise.all([...selected].map((id) => mockApi.getPrevCraInfo(id)));
        close();
        showToast(`Synced previous data for ${selected.size} outlet${selected.size > 1 ? 's' : ''}`, 'success');
      });
    },
  });
}

async function openLocalCraSheet(body) {
  const drafts = await mockApi.getCraDrafts();
  openSheet({
    title: 'Available Audit ID',
    bodyHtml: !drafts.length ? emptyState({ title: 'No local audits', message: 'Create a new audit to get started.', icon: 'fileText' }) : drafts.map((c) => `
      <div class="card" data-cra="${c.id}" style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-weight:700;font-size:13.5px;">Audit ${c.id}</div>
            <div class="o-code">${c.outletName}</div>
            <div class="o-code">${c.date} ${c.time}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="icon-btn" style="color:var(--success)" data-submit="${c.id}" title="Submit">${icons.checkCircle}</button>
            <button class="icon-btn" style="color:var(--danger)" data-del="${c.id}" title="Delete">${icons.trash}</button>
          </div>
        </div>
      </div>`).join(''),
    onMount: (el, close) => {
      el.querySelectorAll('[data-cra]').forEach((card) => card.addEventListener('click', (e) => {
        if (e.target.closest('[data-submit],[data-del]')) return;
        const id = +card.dataset.cra;
        setState({ currentCra: drafts.find((d) => d.id === id) });
        close();
        showToast(`Audit ${id} selected`, 'info');
        load(body);
      }));
      el.querySelectorAll('[data-submit]').forEach((btn) => btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await mockApi.submitCra({ craId: +btn.dataset.submit });
        showToast('Audit submitted successfully', 'success');
        close();
        load(body);
      }));
      el.querySelectorAll('[data-del]').forEach((btn) => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openConfirm({
          iconName: 'trash', iconClass: 'badge-danger', title: 'Delete this audit?', message: 'This local draft will be permanently removed.',
          confirmLabel: 'Delete', danger: true,
          onConfirm: async () => { await mockApi.deleteCraDraft({ craId: +btn.dataset.del }); close(); load(body); },
        });
      }));
    },
  });
}

async function renderActiveCra(body, outlets) {
  const content = body.querySelector('#cra-content');
  const cra = appState.currentCra;
  const outlet = outlets.find((o) => o.id === cra.outletId) || { name: cra.outletName };
  const activities = await mockApi.getCraActivities();

  content.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <div><div style="font-weight:700;font-size:14px;">Audit ${cra.id}</div><div class="o-code">${outlet.name}</div></div>
      <button class="btn btn-ghost" id="switch-ro-btn">Switch</button>
    </div>
    <div class="section-title">Activities</div>
    <div id="activity-list"></div>
    <button class="btn btn-primary" id="submit-cra-btn" style="margin-top:16px;">${icons.checkCircle} Submit Audit</button>
    <button class="btn btn-outline" id="discard-cra-btn" style="margin-top:10px;">Back to Audit Home</button>
  `;

  const listEl = content.querySelector('#activity-list');
  listEl.innerHTML = activities.map((a) => {
    const pct = cra.progress[a.key] || 0;
    return `
      <div class="card tappable" data-activity="${a.key}" style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:700;font-size:13.5px;">${a.title}</span>
          <span style="font-size:12px;font-weight:700;color:${pct === 100 ? 'var(--success)' : 'var(--text-secondary)'}">${pct}%</span>
        </div>
        <div class="progress-bar"><span style="width:${pct}%;background:${pct === 100 ? 'var(--success)' : 'var(--primary)'}"></span></div>
      </div>`;
  }).join('');
  listEl.querySelectorAll('[data-activity]').forEach((card) => card.addEventListener('click', () => navigate(`/cra/section/${card.dataset.activity}`)));

  content.querySelector('#switch-ro-btn').addEventListener('click', () => { setState({ currentCra: null }); load(body); });
  content.querySelector('#discard-cra-btn').addEventListener('click', () => { setState({ currentCra: null }); load(body); });
  content.querySelector('#submit-cra-btn').addEventListener('click', () => {
    openConfirm({
      iconName: 'checkCircle', iconClass: 'badge-success',
      title: 'Submit this audit?',
      message: `This will submit the audit for ${outlet.name} and remove it from your local drafts.`,
      confirmLabel: 'Submit',
      onConfirm: async () => {
        const submitted = await mockApi.submitCra({ craId: cra.id });
        setState({ currentCra: null });
        showToast(`${submitted.id} submitted successfully`, 'success');
        load(body);
      },
    });
  });
}

return {render};
})();

// ==================== screens/cra-section.js ====================
Modules['screens/cra-section'] = (function () {
const {mountScreen} = Modules['components/shell'];
const {mockApi} = Modules['mock-api'];
function navigate(...__a) { return Modules.router.navigate(...__a); }
const {icons} = Modules['components/icons'];
const {CRA_ACTIVITIES, FUEL_TYPES} = Modules['data'];
const {appState, setState} = Modules['state'];
const {openCapture} = Modules['components/capture'];
const {openSignaturePad} = Modules['components/signature'];
const {showToast} = Modules['components/toast'];

function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = value;
}

function emptyFields(fields) {
  const o = {};
  (fields || []).forEach((f) => { o[f.key] = f.type === 'toggle' ? false : ''; if (f.photo) o[f.key + '__photo'] = null; });
  return o;
}

function buildSkeleton(activity) {
  const data = {};
  const fuels = activity.perFuel ? FUEL_TYPES.map((f) => f.id) : [null];
  if (activity.perFuel) {
    data.perFuel = {};
    fuels.forEach((fuel) => {
      data.perFuel[fuel] = {};
      if (activity.fields) data.perFuel[fuel].fields = emptyFields(activity.fields);
      if (activity.repeatNav) data.perFuel[fuel].repeatNav = Array.from({ length: activity.repeatNav.count }, () => emptyFields(activity.repeatNav.fields));
    });
  } else if (activity.fields) {
    data.fields = emptyFields(activity.fields);
  }
  if (activity.extraFields) data.extraFields = emptyFields(activity.extraFields);
  if (activity.checklist) {
    data.checklist = {};
    activity.checklist.forEach((c) => {
      const photoCount = c.photoCount || (c.photo ? 1 : 0);
      data.checklist[c.key] = { value: '', remark: '' };
      if (photoCount) data.checklist[c.key].photos = Array(photoCount).fill(null);
    });
  }
  if (activity.repeatList) data.repeatList = [emptyFields(activity.repeatList.fields)];
  if (activity.repeatNav && !activity.perFuel) data.repeatNav = Array.from({ length: activity.repeatNav.count }, () => emptyFields(activity.repeatNav.fields));
  if (activity.sharedRepeatNav) data.sharedRepeatNav = Array.from({ length: activity.sharedRepeatNav.count }, () => emptyFields(activity.sharedRepeatNav.fields));
  return data;
}

function render(container, params) {
  const cra = appState.currentCra;
  if (!cra) { navigate('/cra'); return; }
  const activity = CRA_ACTIVITIES.find((a) => a.key === params.key);
  if (!activity) { navigate('/cra'); return; }

  const isNewSection = !cra.responses[activity.key];
  const data = cra.responses[activity.key] || buildSkeleton(activity);
  cra.responses[activity.key] = data;
  if (isNewSection && activity.key === 'franchiseeRepresentative' && appState.user) data.fields.tsmName = appState.user.name;

  let activeFuel = activity.perFuel ? FUEL_TYPES[0].id : null;
  let navIndex = { pumps: 0, tanks: 0, fleetOwners: 0, competitors: 0 };

  const body = mountScreen(container, {
    header: { title: activity.title, showBack: true, showProfile: true },
    bodyHtml: `<div id="sec-body"></div>`,
    backFallback: '/cra',
  });

  draw();

  function draw() {
    const el = body.querySelector('#sec-body');
    let html = '';

    if (activity.perFuel) {
      html += `<div class="chip-row" style="margin-bottom:14px;">${FUEL_TYPES.map((f) => `<button class="chip ${activeFuel === f.id ? 'active' : ''}" data-fuel="${f.id}">${f.name}</button>`).join('')}</div>`;
      const scope = data.perFuel[activeFuel];
      if (activity.fields) html += renderFieldGroup(activity.fields, scope.fields, `perFuel.${activeFuel}.fields`);
      if (activity.repeatNav) html += renderRepeatNav(activity.repeatNav, scope.repeatNav, `perFuel.${activeFuel}.repeatNav`, navIndex[activity.repeatNav.key] || 0);
    }

    if (activity.checklist) html += renderChecklist(activity.checklist, data.checklist);
    if (!activity.perFuel && activity.fields) html += renderFieldGroup(activity.fields, data.fields, 'fields');
    if (activity.extraFields) html += renderFieldGroup(activity.extraFields, data.extraFields, 'extraFields');
    if (activity.repeatList) html += renderRepeatList(activity.repeatList, data.repeatList);
    if (activity.repeatNav && !activity.perFuel) html += renderRepeatNav(activity.repeatNav, data.repeatNav, 'repeatNav', navIndex[activity.repeatNav.key] || 0);
    if (activity.sharedRepeatNav) html += renderRepeatNav(activity.sharedRepeatNav, data.sharedRepeatNav, 'sharedRepeatNav', navIndex[activity.sharedRepeatNav.key] || 0);

    html += `
      <div class="sticky-footer" style="background:transparent;border:none;display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:0;">
        <button class="btn btn-primary" id="save-next-btn">Save &amp; Next</button>
        <button class="btn btn-outline" id="cra-home-btn">Audit Home</button>
      </div>`;

    el.innerHTML = html;
    attachEvents(el);
  }

  function renderFieldGroup(fields, scope, pathPrefix) {
    return `<div class="card" style="margin-bottom:14px;">${fields.map((f) => fieldHtml(f, scope[f.key], `${pathPrefix}.${f.key}`, scope[f.key + '__photo'])).join('')}</div>`;
  }

  function renderChecklist(items, scope) {
    return `<div class="section-title" style="margin-top:0;">Checklist</div><div class="card" style="margin-bottom:14px;">
      ${items.map((it) => {
        const val = scope[it.key];
        const options = it.scale === 'gap' ? ['Good', 'Average', 'Poor'] : ['Yes', 'No'];
        const photoCount = it.photoCount || (it.photo ? 1 : 0);
        return `
        <div style="padding:12px 0;border-bottom:1px solid var(--divider);">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="font-size:13px;font-weight:600;flex:1;">${it.label}</span>
            ${Array.from({ length: photoCount }).map((_, i) => `<button class="icon-btn" style="color:${val.photos?.[i] ? 'var(--success)' : 'var(--text-secondary)'}" data-photo-path="checklist.${it.key}.photos.${i}" data-photo-label="${it.label}${photoCount > 1 ? ` (${i + 1}/${photoCount})` : ''}">${icons.camera}</button>`).join('')}
          </div>
          <div class="chip-row">
            ${options.map((o) => `<button class="chip ${val.value === o ? 'active' : ''}" data-set-path="checklist.${it.key}.value" data-set-value="${o}">${o}</button>`).join('')}
          </div>
          <input class="input" style="margin-top:8px;" placeholder="Remarks" data-path="checklist.${it.key}.remark" value="${escapeAttr(val.remark)}" />
        </div>`;
      }).join('')}
    </div>`;
  }

  function renderRepeatList(cfg, rows) {
    return `<div class="section-title">${cfg.label}s</div>
      ${rows.map((row, i) => `
        <div class="card" style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-weight:700;font-size:13px;">${cfg.label} ${i + 1}</span>
            ${rows.length > 1 ? `<button class="icon-btn" style="color:var(--danger)" data-remove-row="${i}">${icons.trash}</button>` : ''}
          </div>
          ${cfg.fields.map((f) => fieldHtml(f, row[f.key], `repeatList.${i}.${f.key}`)).join('')}
        </div>`).join('')}
      ${rows.length < cfg.max ? `<button class="add-row-btn" id="add-row-btn">${icons.plus} Add ${cfg.label}</button>` : ''}
    `;
  }

  function renderRepeatNav(cfg, arr, pathPrefix, idx) {
    const item = arr[idx];
    return `
      <div class="section-title">${cfg.label}s</div>
      <div class="card" style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <button class="icon-btn" id="nav-prev" data-nav-key="${cfg.key}" ${idx === 0 ? 'disabled style="opacity:0.3;"' : ''}>${icons.back}</button>
          <span style="font-weight:700;font-size:13.5px;">${cfg.label} ${idx + 1} of ${cfg.count}</span>
          <button class="icon-btn" id="nav-next" data-nav-key="${cfg.key}" ${idx === cfg.count - 1 ? 'disabled style="opacity:0.3;"' : ''}>${icons.chevRight}</button>
        </div>
        ${cfg.fields.map((f) => fieldHtml(f, item[f.key], `${pathPrefix}.${idx}.${f.key}`, item[f.key + '__photo'])).join('')}
      </div>`;
  }

  function fieldHtml(f, value, path, photoValue) {
    const label = `<label style="display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;">${f.label}</label>`;
    const suffixClass = f.photo ? ' has-suffix' : '';
    let control = '';
    if (f.type === 'text') control = `<input class="input${suffixClass}" data-path="${path}" value="${escapeAttr(value)}" />`;
    else if (f.type === 'number') control = `<input class="input${suffixClass}" type="text" inputmode="decimal" data-path="${path}" value="${escapeAttr(value)}" />`;
    else if (f.type === 'date') control = `<input class="input${suffixClass}" type="date" data-path="${path}" value="${escapeAttr(value)}" />`;
    else if (f.type === 'select') control = `<select class="input${suffixClass}" data-path="${path}"><option value="">Select</option>${f.options.map((o) => `<option value="${o}" ${value === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else if (f.type === 'toggle') control = `<span class="switch ${value ? 'on' : ''}" data-toggle-path="${path}"><span class="knob"></span></span>`;
    else if (f.type === 'signature') control = `<button class="btn btn-secondary btn-sm" data-sign-path="${path}" data-sign-label="${f.label}">${value ? icons.checkCircle + ' Signed — Retake' : icons.edit + ' Add Signature'}</button>`;
    else if (f.type === 'photoOnly') control = `<button class="photo-tile ${value ? 'captured' : ''}" data-photo-path="${path}" data-photo-label="${f.label}"><span class="photo-tile-icon">${value ? icons.checkCircle : icons.camera}</span>${value ? 'Captured — Retake' : 'Capture Photo'}</button>`;

    if (f.photo && (f.type === 'text' || f.type === 'number' || f.type === 'date' || f.type === 'select')) {
      control = `<div class="input-wrap">${control}<button class="input-suffix-btn" style="color:${photoValue ? 'var(--success)' : 'var(--muted)'}" data-photo-path="${path}__photo" data-photo-label="${f.label}">${icons.camera}</button></div>`;
    }

    return `<div class="field" style="margin-bottom:14px;">${label}${control}</div>`;
  }

  function attachEvents(el) {
    el.querySelectorAll('[data-fuel]').forEach((btn) => btn.addEventListener('click', () => { activeFuel = btn.dataset.fuel; draw(); }));
    el.querySelectorAll('[data-path]').forEach((input) => {
      const ev = input.tagName === 'SELECT' || input.type === 'date' ? 'change' : 'input';
      input.addEventListener(ev, () => setPath(data, input.dataset.path, input.value));
    });
    el.querySelectorAll('[data-toggle-path]').forEach((sw) => sw.addEventListener('click', () => {
      const next = !getPath(data, sw.dataset.togglePath);
      setPath(data, sw.dataset.togglePath, next);
      sw.classList.toggle('on', next);
    }));
    el.querySelectorAll('[data-set-path]').forEach((btn) => btn.addEventListener('click', () => {
      setPath(data, btn.dataset.setPath, btn.dataset.setValue);
      draw();
    }));
    el.querySelectorAll('[data-photo-path]').forEach((btn) => btn.addEventListener('click', () => {
      openCapture({ title: btn.dataset.photoLabel, onCapture: (photo) => { setPath(data, btn.dataset.photoPath, photo); showToast('Photo captured', 'success'); draw(); } });
    }));
    el.querySelectorAll('[data-sign-path]').forEach((btn) => btn.addEventListener('click', () => {
      openSignaturePad({ title: btn.dataset.signLabel, onSign: (sig) => { setPath(data, btn.dataset.signPath, sig); showToast('Signature captured', 'success'); draw(); } });
    }));
    const navConfig = (key) => [activity.repeatNav, activity.sharedRepeatNav].find((c) => c && c.key === key);
    el.querySelector('#nav-prev')?.addEventListener('click', (e) => { const k = e.currentTarget.dataset.navKey; if (navIndex[k] > 0) { navIndex[k]--; draw(); } });
    el.querySelector('#nav-next')?.addEventListener('click', (e) => { const k = e.currentTarget.dataset.navKey; const cfg = navConfig(k); if (navIndex[k] < cfg.count - 1) { navIndex[k]++; draw(); } });
    el.querySelector('#add-row-btn')?.addEventListener('click', () => { data.repeatList.push(emptyFields(activity.repeatList.fields)); draw(); });
    el.querySelectorAll('[data-remove-row]').forEach((btn) => btn.addEventListener('click', () => { data.repeatList.splice(+btn.dataset.removeRow, 1); draw(); }));

    el.querySelector('#cra-home-btn').addEventListener('click', () => saveAndGo('/cra'));
    el.querySelector('#save-next-btn').addEventListener('click', () => {
      const idx = CRA_ACTIVITIES.findIndex((a) => a.key === activity.key);
      const nextActivity = CRA_ACTIVITIES[idx + 1];
      saveAndGo(nextActivity ? `/cra/section/${nextActivity.key}` : '/cra');
    });
  }

  function saveAndGo(route) {
    mockApi.saveCraSection({ craId: cra.id, sectionKey: activity.key, responses: data }).then((updated) => {
      setState({ currentCra: updated });
      showToast(`${activity.title} saved`, 'success');
      navigate(route);
    });
  }
}

function escapeAttr(v) { return String(v ?? '').replace(/"/g, '&quot;'); }

return {render};
})();

Modules['screens/monthly-tracker'] = (function () {
const {mountScreen} = Modules['components/shell'];
const {mockApi} = Modules['mock-api'];
function navigate(...__a) { return Modules.router.navigate(...__a); }
const {icons} = Modules['components/icons'];
const {skeletonList, errorState, emptyState} = Modules['components/skeleton'];
const {showToast} = Modules['components/toast'];

function render(container, params) {
  if (params.outletId) return renderForm(container, params.outletId);
  return renderDashboard(container);
}

function statusInfo(rec) {
  if (rec.completed) return { label: 'Completed', cls: 'badge-info' };
  if (rec.percentage === 0) return { label: 'Not Started', cls: 'badge-danger' };
  return { label: 'In Progress', cls: 'badge-warning' };
}

function renderDashboard(container) {
  const body = mountScreen(container, {
    header: { title: 'RO Monthly Tracker', showMenu: true, showProfile: true },
    bodyHtml: `
      <div class="search-row" style="margin-bottom:14px;">
        <div class="search-bar" style="flex:1;">${icons.calendar}<span>August 2026</span></div>
        <button class="filter-btn" id="go-btn">${icons.refresh}</button>
      </div>
      <div id="mt-list">${skeletonList(4)}</div>
    `,
  });
  container.querySelector('#go-btn').addEventListener('click', () => load(body));
  load(body);
}

async function load(body) {
  const listEl = body.querySelector('#mt-list');
  listEl.innerHTML = skeletonList(4);
  try {
    const records = await mockApi.getMonthlyTrackerList();
    if (!records.length) { listEl.innerHTML = emptyState({ title: 'No data found', message: 'No records found for August 2026.', icon: 'checkCircle' }); return; }
    listEl.innerHTML = records.map((r) => {
      const s = statusInfo(r);
      return `
      <div class="card tappable" data-outlet="${r.outletId}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:700;font-size:13.5px;">${r.outletName}</span>
          <span class="badge ${s.cls}">${s.label}</span>
        </div>
        <div class="progress-bar"><span style="width:${r.percentage}%"></span></div>
        <div style="text-align:right;font-size:11.5px;color:var(--text-secondary);margin-top:4px;">${r.percentage}%</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('[data-outlet]').forEach((c) => c.addEventListener('click', () => navigate(`/monthly-tracker/${c.dataset.outlet}`)));
  } catch (err) {
    listEl.innerHTML = errorState({ message: 'Unable to load monthly tracker.' });
    listEl.querySelector('#retry-btn').addEventListener('click', () => load(body));
  }
}

async function renderForm(container, outletId) {
  const body = mountScreen(container, {
    header: { title: 'Monthly Tracker', showBack: true, showProfile: true },
    bodyHtml: `<div class="tabs" id="mt-tabs"><button class="tab-btn active" data-tab="new">New Form</button><button class="tab-btn" data-tab="pending">Pending Point</button></div><div id="mt-form-body"></div>`,
    backFallback: '/monthly-tracker',
  });

  const [rec, questions] = await Promise.all([mockApi.getMonthlyTrackerForm(outletId), mockApi.getMonthlyTrackerQuestions()]);
  let answers = { ...rec.answers };
  let activeTab = 'new';

  function draw() {
    const el = body.querySelector('#mt-form-body');
    body.querySelectorAll('#mt-tabs .tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === activeTab));

    const questionSet = activeTab === 'new' ? questions.map((q, i) => ({ q, i })) : questions.map((q, i) => ({ q, i })).filter(({ i }) => answers[i] === false);

    el.innerHTML = `
      <div class="card" style="margin:14px 0;">
        <div class="stat-row"><span class="s-label">RO Name</span><span class="s-value">${rec.outletName}</span></div>
        <div class="stat-row"><span class="s-label">Date of Visit</span><span class="s-value">2026-08-24</span></div>
      </div>
      ${!questionSet.length ? emptyState({ title: 'No pending points', message: 'No carried-over open items for this outlet.', icon: 'checkCircle' }) : questionSet.map(({ q, i }) => `
        <div class="card" style="margin-bottom:10px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:10px;">${q}</div>
          <div class="chip-row">
            <button class="chip ${answers[i] === true ? 'active' : ''}" data-q="${i}" data-val="yes">Yes</button>
            <button class="chip ${answers[i] === false ? 'active' : ''}" data-q="${i}" data-val="no">No</button>
          </div>

async function openTaskSheet(body, outletId) {
  const [rec, questions] = await Promise.all([mockApi.getMonthlyTrackerForm(outletId), mockApi.getMonthlyTrackerQuestions()]);
  const answers = { ...rec.answers };
  const outstanding = questions.map((q, i) => ({ q, i })).filter(({ i }) => answers[i] !== true);

  const close = openSheet({
    title: rec.outletName,
    bodyHtml: !outstanding.length ? emptyState({ title: 'Nothing pending', message: 'All items are resolved.', icon: 'checkCircle' }) : outstanding.map(({ q, i }) => `

        </div>

    footerHtml: outstanding.length ? `<button class="btn btn-primary" id="pt-submit-btn">Submit</button>` : '',
    onMount: (el) => {
      el.querySelectorAll('[data-q]').forEach((btn) => btn.addEventListener('click', () => {

        showToast('Updated successfully', 'success');
        close();
        load(body);
      });
    },
  });
}

return {render};
})();

// ==================== router.js ====================
Modules['router'] = (function () {
const {appState, setState} = Modules['state'];
const {closeDrawer} = Modules['components/navigation'];
const {closeAllOverlays} = Modules['components/modal'];
const {icons} = Modules['components/icons'];

const splash = Modules['screens/splash'];
const login = Modules['screens/login'];
const otp = Modules['screens/otp'];
const masterSync = Modules['screens/master-sync'];
const resync = Modules['screens/resync'];
const selectTsm = Modules['screens/select-tsm'];
const selectTracker = Modules['screens/select-tracker'];
const dashboard = Modules['screens/dashboard'];
const craDashboard = Modules['screens/cra-dashboard'];
const craSection = Modules['screens/cra-section'];
const monthlyTracker = Modules['screens/monthly-tracker'];
const pendingTasks = Modules['screens/pending-tasks'];
const indent = Modules['screens/indent'];
const accountInfo = Modules['screens/account-info'];
const profile = Modules['screens/profile'];

const PUBLIC_ROUTES = ['/splash', '/login', '/otp'];
const ONBOARDING_ROUTES = ['/sync', '/select-tsm', '/select-tracker'];

const routes = [
  { pattern: '/splash', screen: splash },
  { pattern: '/login', screen: login },
  { pattern: '/otp', screen: otp },
  { pattern: '/sync', screen: masterSync },
  { pattern: '/master-sync', screen: resync },
  { pattern: '/select-tsm', screen: selectTsm },
  { pattern: '/select-tracker', screen: selectTracker },
  { pattern: '/dashboard', screen: dashboard },
  { pattern: '/cra', screen: craDashboard },
  { pattern: '/cra/section/:key', screen: craSection },
  { pattern: '/monthly-tracker', screen: monthlyTracker },
  { pattern: '/monthly-tracker/:outletId', screen: monthlyTracker },
  { pattern: '/pending-tasks', screen: pendingTasks },
  { pattern: '/indent', screen: indent },
  { pattern: '/account', screen: accountInfo },
  { pattern: '/profile', screen: profile },
];

function matchRoute(rawPath) {
  const path = rawPath.split('?')[0];
  for (const route of routes) {
    const parts = route.pattern.split('/').filter(Boolean);
    const pathParts = path.split('/').filter(Boolean);
    if (parts.length !== pathParts.length) continue;
    const params = {};
    let ok = true;
    for (let i = 0; i < parts.length; i++) {
      if (parts[i].startsWith(':')) params[parts[i].slice(1)] = decodeURIComponent(pathParts[i]);
      else if (parts[i] !== pathParts[i]) { ok = false; break; }
    }
    if (ok) return { route, params };
  }
  return null;
}

function navigate(path) {
  if (location.hash.slice(1) === path) return;
  location.hash = path;
}

function replace(path) {
  history.replaceState(null, '', `#${path}`);
  handleRoute();
}

function goBack(fallback) {
  if (history.length > 2) history.back();
  else navigate(fallback || '/dashboard');
}

let appRoot;

function initRouter(rootEl) {
  appRoot = rootEl;
  window.addEventListener('hashchange', handleRoute);
  handleRoute();
}

function handleRoute() {
  closeDrawer();
  closeAllOverlays();
  let path = location.hash.slice(1) || '/splash';

  const loggedIn = !!appState.user;
  if (!loggedIn && !PUBLIC_ROUTES.includes(path)) {
    history.replaceState(null, '', '#/login');
    path = '/login';
  } else if (loggedIn && !appState.otpVerified && path !== '/otp') {
    history.replaceState(null, '', '#/otp');
    path = '/otp';
  } else if (loggedIn && appState.otpVerified && !appState.syncCompleted && path !== '/sync') {
    history.replaceState(null, '', '#/sync');
    path = '/sync';
  } else if (loggedIn && appState.otpVerified && appState.syncCompleted && (path === '/login' || path === '/splash' || path === '/otp' || path === '/sync')) {
    history.replaceState(null, '', '#/dashboard');
    path = '/dashboard';
  }

  const matched = matchRoute(path) || matchRoute('/dashboard');
  setState({ currentRoute: path });

  appRoot.innerHTML = '';
  const screenEl = document.createElement('div');
  screenEl.className = 'screen';
  appRoot.appendChild(screenEl);

  try {
    matched.route.screen.render(screenEl, { ...matched.params, routeMeta: matched.route, fullPath: path });
  } catch (err) {
    console.error('Screen render failed:', err);
    screenEl.innerHTML = `
      <div class="state-block" style="padding-top:80px;">
        <div class="state-icon" style="color:var(--danger);background:var(--danger-light)">${icons.alertTriangle}</div>
        <h4>Something went wrong.</h4>
        <p>This screen couldn't be displayed.</p>
        <button class="btn btn-primary" id="router-error-back">Back to Dashboard</button>
      </div>`;
    screenEl.querySelector('#router-error-back').addEventListener('click', () => navigate('/dashboard'));
  }
}

return {navigate, replace, goBack, initRouter, handleRoute};
})();

Modules['app'] = (function () {
function initRouter(...__a) { return Modules.router.initRouter(...__a); }
const {appState, loadPersistedDeviceMode, setDeviceMode} = Modules['state'];
const {initAppNav} = Modules['components/app-nav'];

// Mobile/Tablet is a preview-chrome choice, not something the app itself would ever ask the
// user — so it lives entirely outside the device frame, in the browser-level toolbar below,
// rather than as an in-app screen or setting.
const initialDeviceMode = loadPersistedDeviceMode() || 'mobile';
document.documentElement.setAttribute('data-device', initialDeviceMode);
appState.deviceMode = initialDeviceMode;

function initPreviewToolbar() {
  const toolbar = document.getElementById('preview-toolbar');
  if (!toolbar) return;
  const buttons = toolbar.querySelectorAll('[data-preview-device]');
  buttons.forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.previewDevice === appState.deviceMode);
    btn.addEventListener('click', () => {
      setDeviceMode(btn.dataset.previewDevice);
      buttons.forEach((b) => b.classList.toggle('active', b === btn));
    });
  });
}
initPreviewToolbar();

const timeEl = document.getElementById('status-time');
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes().toString().padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  timeEl.textContent = `${h}:${m}`;
}
updateClock();
setInterval(updateClock, 30000);

initAppNav();
initRouter(document.getElementById('app'));

return {};
})();
