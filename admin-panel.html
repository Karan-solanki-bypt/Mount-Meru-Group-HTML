<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#C23528" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23C23528'/%3E%3Ctext x='13' y='18' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='15' fill='white'%3Em%3C/text%3E%3Ccircle cx='7' cy='6' r='2.4' fill='%23FAD201'/%3E%3C/svg%3E" />
<title>Mount Meru Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Same Mount Meru Group brand palette / tokens as the mobile app, so the admin panel reads as
     one product rather than a redesign. */
  --primary: #C23528;
  --primary-dark: #8F1F15;
  --primary-darker: #6B160E;
  --primary-light: #FBEAE8;
  --primary-tint: #FDF3F2;
  --accent: #FAD201;
  --accent-dark: #DCB800;

  --background: #F4F5F7;
  --surface: #FFFFFF;
  --surface-alt: #F7F8FA;
  --surface-raised: #FFFFFF;

  --text: #1A1C20;
  --text-secondary: #61656D;
  --muted: #94989F;
  --border: #E4E6EA;
  --border-strong: #D2D5DB;
  --divider: #EBEDF0;

  --success: #1B9A5A;
  --success-light: #E4F7ED;
  --warning: #B8860A;
  --warning-light: #FFF6DD;
  --danger: #D1272F;
  --danger-light: #FBE8E9;
  --info: #2569C9;
  --info-light: #E9F1FD;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-7: 32px; --space-8: 40px;

  --radius-xs: 8px; --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 24px; --radius-full: 999px;

  --shadow-xs: 0 1px 2px rgba(20, 20, 25, 0.05);
  --shadow-sm: 0 2px 6px rgba(20, 20, 25, 0.06), 0 1px 2px rgba(20, 20, 25, 0.05);
  --shadow-md: 0 8px 20px rgba(20, 20, 25, 0.09), 0 2px 6px rgba(20, 20, 25, 0.06);
  --shadow-lg: 0 20px 44px rgba(20, 20, 25, 0.18), 0 4px 12px rgba(20, 20, 25, 0.08);
  --shadow-primary: 0 8px 20px rgba(194, 53, 40, 0.28);

  --sidebar-w: 244px;
  --sidebar-w-collapsed: 76px;
  --topbar-h: 64px;

  --font: 'Inter', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  --text-xs: 11px; --text-sm: 12.5px; --text-base: 14px; --text-md: 15px; --text-lg: 17px; --text-xl: 20px; --text-2xl: 24px;

  --ease-standard: cubic-bezier(.22, .9, .36, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  --z-sidebar: 200; --z-drawer: 300; --z-modal: 500; --z-toast: 600;
}

:root[data-theme="dark"] {
  --background: #131417;
  --surface: #1C1E22;
  --surface-alt: #202226;
  --surface-raised: #24262B;
  --text: #F3F4F6;
  --text-secondary: #B4B7BE;
  --muted: #83868D;
  --border: #303237;
  --border-strong: #3A3D43;
  --divider: #2B2D32;
  --primary-light: #3A1E1A;
  --primary-tint: #2A1613;
  --success-light: #143826;
  --warning-light: #3A2E0A;
  --danger-light: #3A1416;
  --info-light: #142A42;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--background);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
svg { width: 1em; height: 1em; flex-shrink: 0; }
button, input, select, textarea { font-family: inherit; color: inherit; font-size: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

/* ============ Buttons (same component as the mobile app) ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 42px; padding: 0 18px; border-radius: var(--radius-md);
  font-size: 13.5px; font-weight: 700; letter-spacing: -0.005em; white-space: nowrap;
  transition: transform 100ms var(--ease-standard), opacity 100ms var(--ease-standard), background 160ms var(--ease-standard), box-shadow 160ms var(--ease-standard);
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(155deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; box-shadow: var(--shadow-primary); }
.btn-primary:disabled { background: #EFC0BE; box-shadow: none; cursor: not-allowed; }
.btn-secondary { background: var(--primary-light); color: var(--primary); }
.btn-outline { background: var(--surface); border: 1.5px solid var(--border-strong); color: var(--text); }
.btn-outline:hover { background: var(--surface-alt); }
.btn-ghost { background: transparent; color: var(--primary); height: auto; padding: 6px 4px; }
.btn-danger { background: var(--danger); color: #fff; box-shadow: 0 8px 20px rgba(209, 39, 47, 0.24); }
.btn-sm { height: 36px; font-size: 12.5px; padding: 0 13px; }
.btn-block { width: 100%; }
.btn svg { width: 16px; height: 16px; }

.icon-btn {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); color: var(--text-secondary); flex: 0 0 auto;
  transition: background 140ms var(--ease-standard), color 140ms var(--ease-standard);
}
.icon-btn:hover { background: var(--surface-alt); color: var(--text); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn-sm { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
.icon-btn-sm:hover { background: var(--surface-alt); color: var(--primary); }
.icon-btn-sm.danger:hover { background: var(--danger-light); color: var(--danger); }
.icon-btn-sm svg { width: 16px; height: 16px; }

/* ============ Inputs / forms ============ */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 7px; }
.field-hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.input, select.input {
  width: 100%; height: 42px; border-radius: var(--radius-md); border: 1.5px solid var(--border);
  background: var(--surface-alt); padding: 0 13px; font-size: 13.5px; color: var(--text);
  transition: border-color 140ms var(--ease-standard), box-shadow 140ms var(--ease-standard), background 140ms var(--ease-standard);
}
.input:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-light); outline: none; }
.input.error { border-color: var(--danger); }
.field-error { color: var(--danger); font-size: 12px; margin-top: 6px; }
textarea.input { height: auto; min-height: 84px; padding: 11px 13px; resize: vertical; }
.checkbox-row { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; line-height: 1; }
.checkbox-row input { width: 17px; height: 17px; margin: 0; flex-shrink: 0; accent-color: var(--primary); }
.checkbox-group { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md); background: var(--surface-alt); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-grid .field.full { grid-column: 1 / -1; }

.switch { display: inline-block; position: relative; width: 42px; height: 25px; border-radius: var(--radius-full); background: var(--divider); flex: 0 0 auto; transition: background 180ms var(--ease-standard); }
.switch.on { background: var(--primary); }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform 180ms var(--ease-spring); }
.switch.on .knob { transform: translateX(17px); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--divider); }
.switch-row:last-child { border-bottom: none; }
.switch-row .sr-title { font-size: 13.5px; font-weight: 700; }
.switch-row .sr-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ============ Search / filters ============ */
.search-bar { display: flex; align-items: center; gap: 8px; background: var(--surface-alt); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 0 12px; height: 40px; transition: border-color 140ms var(--ease-standard), background 140ms var(--ease-standard); flex: 1 1 auto; min-width: 160px; }
.search-bar:focus-within { border-color: var(--primary); background: var(--surface); }
.search-bar svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
.search-bar input { flex: 1 1 auto; height: 100%; border: none; background: transparent; font-size: 13px; min-width: 0; }
.search-bar input:focus { outline: none; }
.search-bar .clear-btn { color: var(--muted); display: flex; }
.search-bar .clear-btn svg { width: 14px; height: 14px; }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { flex: 0 0 auto; padding: 8px 14px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; background: var(--surface); border: 1.5px solid var(--border); color: var(--text-secondary); white-space: nowrap; transition: background 140ms var(--ease-standard), color 140ms var(--ease-standard), border-color 140ms var(--ease-standard); }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ============ Cards / KPI ============ */
.card { background: var(--surface); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.section-title { font-size: var(--text-sm); font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.section-title .link { text-transform: none; letter-spacing: 0; color: var(--primary); font-weight: 700; font-size: 12.5px; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpi-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.kpi-card { background: var(--surface); border-radius: var(--radius-lg); padding: 18px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.kpi-card .kpi-top { display: flex; align-items: flex-start; justify-content: space-between; }
.kpi-card .kpi-icon { width: 38px; height: 38px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; background: var(--primary-light); color: var(--primary); }
.kpi-card .kpi-icon svg { width: 19px; height: 19px; }
.kpi-card .kpi-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.15; letter-spacing: -0.01em; margin-top: 14px; }
.kpi-card .kpi-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-weight: 600; }
.kpi-card .kpi-trend { font-size: 11.5px; font-weight: 700; margin-top: 10px; display: inline-flex; align-items: center; gap: 4px; }
.kpi-trend.up { color: var(--success); }
.kpi-trend.down { color: var(--danger); }
.kpi-trend svg { width: 13px; height: 13px; }

.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.quick-action { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border); font-size: 12.5px; font-weight: 700; color: var(--text); box-shadow: var(--shadow-xs); text-align: left; }
.quick-action:hover { background: var(--surface-alt); }
.quick-action .qa-icon { width: 38px; height: 38px; border-radius: var(--radius-full); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.quick-action .qa-icon svg { width: 18px; height: 18px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--radius-full); font-size: 10.5px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-success { background: var(--success-light); color: var(--success); }
.badge-warning { background: var(--warning-light); color: var(--warning); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-info { background: var(--info-light); color: var(--info); }
.badge-muted { background: var(--divider); color: var(--muted); }

.bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 8px; }
.bar-chart .bar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px; }
.bar-chart .bar { width: 100%; max-width: 34px; border-radius: 5px 5px 0 0; background: var(--primary); min-height: 3px; transition: height 500ms var(--ease-standard); }
.bar-chart .bar-label { font-size: 10.5px; color: var(--muted); font-weight: 600; }

.progress-bar { height: 7px; border-radius: var(--radius-full); background: var(--divider); overflow: hidden; min-width: 90px; }
.progress-bar > span { display: block; height: 100%; border-radius: var(--radius-full); background: var(--primary); transition: width 450ms var(--ease-standard); }
.progress-bar.success > span { background: var(--success); }
.progress-bar.danger > span { background: var(--danger); }

.indent-status-row { display: flex; align-items: flex-start; gap: 6px; }
.indent-status-step { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); position: relative; }
.indent-status-step svg { width: 18px; height: 18px; flex: 0 0 auto; }
.indent-status-step.done { color: var(--success); }
.indent-status-step:not(:last-child)::after { content: ''; position: absolute; top: 9px; left: calc(50% + 14px); width: calc(100% - 12px); height: 2px; background: var(--divider); }
.indent-status-step.done:not(:last-child)::after { background: var(--success); }

.timeline { position: relative; padding-left: 22px; }
.timeline-item { position: relative; padding-bottom: 20px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before { content: ''; position: absolute; left: -22px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--divider); border: 2px solid var(--surface); }
.timeline-item.done::before { background: var(--success); }
.timeline-item.active::before { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.timeline-item::after { content: ''; position: absolute; left: -18px; top: 13px; bottom: -8px; width: 2px; background: var(--divider); }
.timeline-item:last-child::after { display: none; }
.timeline-item .t-title { font-size: 13px; font-weight: 700; }
.timeline-item .t-time { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ============ App shell: sidebar + topbar ============ */
.admin-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex: 0 0 auto; background: var(--surface); border-right: 1px solid var(--divider);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: var(--z-sidebar);
  transition: width 200ms var(--ease-standard);
}
.sidebar.collapsed { width: var(--sidebar-w-collapsed); }
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; flex: 0 0 auto; }
.sidebar-brand svg { width: 32px; height: 32px; flex: 0 0 auto; }
.sidebar-brand .brand-text { font-size: 14.5px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; white-space: nowrap; overflow: hidden; }
.sidebar-brand .brand-text small { display: block; font-size: 10.5px; font-weight: 600; color: var(--text-secondary); }
.sidebar.collapsed .brand-text { display: none; }
.sidebar-nav { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 6px 12px; }
.sidebar-section-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 14px 12px 6px; }
.sidebar-section-label:first-child { padding-top: 4px; }
.sidebar.collapsed .sidebar-section-label { padding: 14px 0 6px; text-align: center; height: 1px; overflow: hidden; }
.sidebar.collapsed .sidebar-section-label:first-child { height: auto; overflow: visible; }
.sidebar-nav-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap;
  transition: background 140ms var(--ease-standard), color 140ms var(--ease-standard);
}
.sidebar-nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; }
.sidebar-nav-item span { overflow: hidden; text-overflow: ellipsis; }
.sidebar-nav-item:hover { background: var(--surface-alt); color: var(--text); }
.sidebar-nav-item .badge { padding: 2px 7px; font-size: 10px; }
.sidebar-nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 700; }
.sidebar.collapsed .sidebar-nav-item { justify-content: center; padding: 10px; }
.sidebar.collapsed .sidebar-nav-item span { display: none; }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--divider); flex: 0 0 auto; }
.sidebar-collapse-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 38px; border-radius: var(--radius-md); color: var(--text-secondary); font-size: 12px; font-weight: 700; }
.sidebar-collapse-btn:hover { background: var(--surface-alt); }
.sidebar-collapse-btn svg { width: 16px; height: 16px; transition: transform 200ms var(--ease-standard); }
.sidebar.collapsed .sidebar-collapse-btn svg { transform: rotate(180deg); }
.sidebar.collapsed .sidebar-collapse-btn span { display: none; }

.admin-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  height: var(--topbar-h); flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 0 22px;
  background: var(--surface); border-bottom: 1px solid var(--divider); position: sticky; top: 0; z-index: 150;
}
.sidebar-open-btn { display: none; }
.topbar-search { max-width: 380px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.header-badge-wrap { position: relative; }
.header-badge { position: absolute; top: 3px; right: 3px; min-width: 15px; height: 15px; border-radius: var(--radius-full); background: var(--primary); color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 3px; border: 1.5px solid var(--surface); }

.profile-btn { display: flex; align-items: center; gap: 9px; padding: 6px 10px 6px 6px; border-radius: var(--radius-full); }
.profile-btn:hover { background: var(--surface-alt); }
.profile-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; flex: 0 0 auto; }
.profile-btn .p-name { font-size: 12.5px; font-weight: 700; line-height: 1.2; text-align: left; }
.profile-btn .p-role { font-size: 10.5px; color: var(--text-secondary); font-weight: 500; }
.profile-btn svg.chev { width: 14px; height: 14px; color: var(--muted); }

.dropdown-wrap { position: relative; }
.dropdown-menu {
  position: absolute; top: calc(100% + 8px); right: 0; min-width: 220px; background: var(--surface);
  border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  padding: 8px; z-index: 250; display: none;
}
.dropdown-menu.open { display: block; }
.dropdown-menu.notif-panel.open { display: flex; }
.dropdown-menu .dd-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; color: var(--text); width: 100%; text-align: left; }
.dropdown-menu .dd-item:hover { background: var(--surface-alt); }
.dropdown-menu .dd-item svg { width: 16px; height: 16px; color: var(--text-secondary); }
.dropdown-menu .dd-item.danger { color: var(--danger); }
.dropdown-menu .dd-item.danger svg { color: var(--danger); }
.dropdown-menu .dd-divider { height: 1px; background: var(--divider); margin: 6px 2px; }
.dropdown-header { padding: 8px 10px 10px; border-bottom: 1px solid var(--divider); margin-bottom: 6px; }
.dropdown-header .dh-name { font-size: 13px; font-weight: 700; }
.dropdown-header .dh-email { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; }

.notif-panel { width: 340px; max-height: 420px; flex-direction: column; padding: 0; }
.notif-panel .np-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--divider); }
.notif-panel .np-header h4 { font-size: 13.5px; font-weight: 700; }
.notif-panel .np-header button { font-size: 11.5px; font-weight: 700; color: var(--primary); }
.notif-panel .np-list { overflow-y: auto; flex: 1 1 auto; padding: 6px; }
.notif-panel .np-footer { padding: 10px 14px; border-top: 1px solid var(--divider); text-align: center; }
.notif-panel .np-footer a { font-size: 12px; font-weight: 700; color: var(--primary); }

.content { flex: 1 1 auto; padding: 26px 30px 60px; min-width: 0; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-header h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
.page-header .sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.page-header .ph-actions { display: flex; gap: 10px; align-items: center; }
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

/* ============ Data table ============ */
.table-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; }
.table-toolbar { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--divider); flex-wrap: wrap; }
.table-toolbar .tt-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.table-toolbar select.input { width: auto; min-width: 130px; }
.table-scroll { overflow-x: auto; }
table.data-table { width: 100%; border-collapse: collapse; min-width: 720px; }
.data-table th { text-align: left; font-size: 10.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; padding: 11px 18px; border-bottom: 1px solid var(--divider); background: var(--surface-alt); white-space: nowrap; }
.data-table th.right, .data-table td.right { text-align: right; }
.data-table td { padding: 13px 18px; font-size: 13px; border-bottom: 1px solid var(--divider); vertical-align: middle; color: var(--text); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover td { background: var(--surface-alt); }
.data-table .cell-primary { font-weight: 700; color: var(--text); }
.data-table .cell-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }
.row-actions { display: flex; gap: 3px; justify-content: flex-end; }
.row-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; margin-right: 10px; vertical-align: middle; flex: 0 0 auto; }
.cell-with-avatar { display: flex; align-items: center; }

.pagination { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-top: 1px solid var(--divider); gap: 12px; flex-wrap: wrap; }
.pagination .page-info { font-size: 12px; color: var(--text-secondary); }
.pagination .page-btns { display: flex; gap: 6px; }
.page-btn { min-width: 30px; height: 30px; padding: 0 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); }
.page-btn:hover:not(:disabled) { background: var(--surface-alt); }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ============ Tabs (settings) ============ */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--divider); }
.tab-btn { flex: 0 0 auto; padding: 10px 16px; font-size: 13px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ============ Loading / skeleton / empty / error ============ */
.skeleton { background: linear-gradient(90deg, var(--divider) 25%, var(--border) 37%, var(--divider) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 6px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
.sk-line { height: 12px; border-radius: 6px; }
.spinner { display: inline-block; width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--divider); border-top-color: var(--primary); animation: spin 700ms linear infinite; }
.spinner.sm { width: 16px; height: 16px; border-width: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.state-block { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 56px 24px; gap: 6px; }
.state-block .state-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; color: var(--muted); }
.state-block.error .state-icon { background: var(--danger-light); color: var(--danger); }
.state-block .state-icon svg { width: 28px; height: 28px; }
.state-block h4 { font-size: var(--text-md); font-weight: 700; color: var(--text); }
.state-block p { font-size: 13px; color: var(--text-secondary); max-width: 300px; line-height: 1.55; }
.state-block .btn { width: auto; margin-top: 14px; }

/* ============ Overlays: modal / toast ============ */
.overlay-backdrop { position: fixed; inset: 0; background: rgba(12,12,16,0.5); z-index: var(--z-modal); opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease-standard); backdrop-filter: blur(2px); }
.overlay-backdrop.open { opacity: 1; pointer-events: auto; }
.modal-center-wrap { position: fixed; inset: 0; z-index: calc(var(--z-modal) + 1); display: flex; align-items: center; justify-content: center; padding: 24px; pointer-events: none; }
.modal-card {
  width: 100%; max-width: 320px; background: var(--surface); border-radius: var(--radius-lg); padding: 24px 22px;
  box-shadow: var(--shadow-lg); text-align: center; transform: scale(0.94) translateY(6px); opacity: 0;
  transition: all 200ms var(--ease-standard); pointer-events: auto;
}
.modal-card.open { transform: scale(1) translateY(0); opacity: 1; }
.modal-icon { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }
.modal-icon svg { width: 25px; height: 25px; }
.modal-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 7px; letter-spacing: -0.01em; }
.modal-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 18px; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1 1 0; width: auto; }
.modal-card.form-modal { max-width: 540px; text-align: left; padding: 0; }
.modal-card.form-modal .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 17px 22px; border-bottom: 1px solid var(--divider); }
.form-progress-wrap { padding: 14px 22px 0; }
.form-progress-label { font-size: 11px; color: var(--text-secondary); margin-top: 6px; font-weight: 600; }
.modal-card.form-modal .modal-header h3 { font-size: 15.5px; font-weight: 700; margin: 0; }
.modal-card.form-modal .modal-body { padding: 20px 22px 4px; max-height: 62vh; overflow-y: auto; }
.modal-card.form-modal .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--divider); }
.modal-card.form-modal .modal-footer .btn { width: auto; flex: none; }

.toast-root { position: fixed; left: 0; right: 0; bottom: 24px; z-index: var(--z-toast); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { display: flex; align-items: center; gap: 9px; background: #1D1F24; color: #fff; padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); max-width: 380px; animation: toastIn 220ms var(--ease-standard); }
.toast svg { width: 16px; height: 16px; flex: 0 0 auto; }
.toast.success { background: #14804A; }
.toast.error { background: var(--danger); }
.toast.info { background: #1D1F24; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }
.toast.leaving { animation: toastOut 180ms var(--ease-standard) forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

/* ============ Sign in (same Employee ID + OTP flow as the mobile app) ============ */
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--background); padding: 24px; }
.auth-card { width: 100%; max-width: 400px; background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); border: 1px solid var(--border); overflow: hidden; }
.login-screen { padding: 38px 32px 30px; display: flex; flex-direction: column; }
.login-logo { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; color: var(--primary); filter: drop-shadow(0 6px 14px rgba(194,53,40,0.28)); }
.login-logo svg { width: 60px; height: 60px; }
.login-screen h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
.login-screen .sub { font-size: 13px; color: var(--text-secondary); margin: 5px 0 26px; line-height: 1.5; }
.login-error-banner { display: flex; gap: 8px; align-items: flex-start; background: var(--danger-light); color: var(--danger); padding: 12px 14px; border-radius: var(--radius-md); font-size: 12.5px; font-weight: 600; margin-bottom: 16px; }
.login-error-banner svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; }
.demo-hint { background: var(--surface-alt); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); padding: 11px 13px; font-size: 11.5px; color: var(--text-secondary); margin-top: 20px; line-height: 1.65; }
.login-footer { margin-top: 22px; text-align: center; font-size: 11px; color: var(--muted); }
.otp-back-btn { align-self: flex-start; margin: -6px 0 6px -8px; color: var(--text); }

/* ============ Detail panel (right-side drawer for quick inspection of a record) ============ */
.detail-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 92vw; background: var(--surface); z-index: calc(var(--z-modal) + 1); transform: translateX(105%); transition: transform 260ms var(--ease-standard); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); pointer-events: auto; }
.detail-panel.open { transform: translateX(0); }
.detail-panel .dp-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px; border-bottom: 1px solid var(--divider); flex: 0 0 auto; }
.detail-panel .dp-header h3 { font-size: 16.5px; font-weight: 800; letter-spacing: -0.01em; }
.detail-panel .dp-header .dp-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.detail-panel .dp-body { padding: 18px 22px; overflow-y: auto; flex: 1 1 auto; }
.detail-panel .dp-footer { padding: 14px 22px; border-top: 1px solid var(--divider); flex: 0 0 auto; display: flex; justify-content: flex-end; gap: 10px; }
.dp-section { margin-bottom: 20px; }
.dp-section:last-child { margin-bottom: 0; }
.dp-section-title { font-size: 10.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
.dp-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--divider); font-size: 13px; }
.dp-row:last-child { border-bottom: none; }
.dp-row .dp-k { color: var(--text-secondary); flex: 0 0 auto; }
.dp-row .dp-v { font-weight: 700; color: var(--text); text-align: right; }
.dp-chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.dp-photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dp-photo-tile { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); background: var(--surface-alt); }
.dp-photo-tile img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.dp-photo-tile button.dp-photo-btn { display: block; width: 100%; padding: 0; }
.dp-photo-caption { padding: 7px 9px; font-size: 11px; font-weight: 600; color: var(--text-secondary); }
.dp-photo-tile.missing { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; aspect-ratio: 4/3; color: var(--muted); border-style: dashed; }
.dp-photo-tile.missing svg { width: 22px; height: 22px; }
.dp-photo-tile.missing .dp-photo-caption { padding: 0; }

/* ============ Mobile drawer (reuses the same drawer pattern as the phone app) ============ */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(12,12,16,0.52); z-index: var(--z-drawer); opacity: 0; pointer-events: none; transition: opacity 220ms var(--ease-standard); }
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 82%; max-width: 300px; background: var(--surface); z-index: calc(var(--z-drawer) + 1); transform: translateX(-105%); transition: transform 260ms var(--ease-standard); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg); }
.drawer.open { transform: translateX(0); }
.drawer-profile { background: linear-gradient(150deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; padding: 26px 20px 20px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; }
.drawer-avatar { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; border: 2px solid rgba(255,255,255,0.35); }
.drawer-profile .name { font-size: 14.5px; font-weight: 700; }
.drawer-profile .role { font-size: 11.5px; opacity: 0.9; margin-top: 2px; }
.drawer-nav { flex: 1 1 auto; overflow-y: auto; padding: 10px; }

/* ============ Responsive ============ */
@media (max-width: 1180px) {
  .kpi-grid, .kpi-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
  .quick-actions { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 1024px) {
  .sidebar { display: none; }
  .sidebar-open-btn { display: flex; }
  .content { padding: 20px 20px 50px; }
}
@media (max-width: 640px) {
  .kpi-grid, .kpi-grid.cols-3, .quick-actions { grid-template-columns: 1fr 1fr; }
  .topbar { padding: 0 14px; gap: 8px; }
  .topbar-search { display: none; }
  .profile-btn .p-name, .profile-btn .p-role, .profile-btn svg.chev { display: none; }
  .page-header { flex-direction: column; align-items: stretch; }
  .page-header .ph-actions { justify-content: flex-end; }
  .form-grid { grid-template-columns: 1fr; }
  .table-toolbar { flex-direction: column; align-items: stretch; }
  .table-toolbar .search-bar { max-width: none; }
}
</style>
</head>
<body>

<div class="auth-wrap" id="authWrap"></div>

<div class="admin-shell" id="adminShell" style="display:none;">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="admin-main">
    <header class="topbar">
      <button class="icon-btn sidebar-open-btn" id="drawerOpenBtn" aria-label="Open menu"></button>

/* ==================== small helpers ==================== */
function paginate(rows, page, pageSize) {
  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const p = Math.min(Math.max(1, page), totalPages);
  return { rows: rows.slice((p - 1) * pageSize, p * pageSize), page: p, totalPages, total };
}
function statusBadgeClass(status) {
  return { Active: 'badge-success', Published: 'badge-success', Ready: 'badge-success', Completed: 'badge-success',
    Inactive: 'badge-muted', Archived: 'badge-muted',
    Pending: 'badge-warning', Draft: 'badge-warning', 'Local (unsynced)': 'badge-warning', 'In Progress': 'badge-warning', 'Payment Pending': 'badge-warning',
    'En-route': 'badge-info',
    Failed: 'badge-danger', Suspended: 'badge-danger', Overdue: 'badge-danger', 'Not Started': 'badge-danger' }[status] || 'badge-muted';
}

/* ==================== toast ==================== */
function showToast(type, message) {
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const ic = type === 'success' ? 'checkCircle' : type === 'error' ? 'xCircle' : 'info';
  el.innerHTML = `${icons[ic]}<span>${esc(message)}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  }, 3200);
}

function updateFormProgress(form) {
  if (!form) return;
  const bar = form.querySelector('#formProgressBar > span');
  const label = form.querySelector('#formProgressLabel');
  if (!bar || !label) return;
  const fields = [...form.querySelectorAll('[name]')].filter(f => f.type !== 'hidden');
  const filled = fields.filter(f => (f.value || '').toString().trim() !== '').length;
  const pct = fields.length ? Math.round((filled / fields.length) * 100) : 100;
  bar.style.width = pct + '%';
  label.textContent = `${filled} of ${fields.length} fields completed`;
}
function openFormModal({ title, bodyHtml, submitLabel = 'Save', onSubmit }) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `

        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">${esc(submitLabel)}</button>
        </div>
      </form>
    </div>`;
  document.getElementById('overlayBackdrop').classList.add('open');
  requestAnimationFrame(() => root.querySelector('.modal-card').classList.add('open'));
  const form = root.querySelector('#modalForm');
  form.addEventListener('input', () => updateFormProgress(form));
  form.addEventListener('change', () => updateFormProgress(form));
  updateFormProgress(form);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    onSubmit(new FormData(e.target));
  });
}

/* ---- Geography tab (Zone > State > Division > District > Territory, one generic CRUD) ---- */
function renderGeographyTab() {
  const level = state.content.geoLevel || 'zone';
  const levelInfo = GEO_LEVELS.find(l => l.key === level);
  const parentInfo = levelInfo.parentKey ? GEO_LEVELS.find(l => l.key === levelInfo.parentKey) : null;
  const rows = levelInfo.list();
  return `
    <div class="table-card">
      <div class="table-toolbar">
        <div class="chip-row">${GEO_LEVELS.map(l => `<button class="chip ${level === l.key ? 'active' : ''}" data-geo-level="${l.key}">${l.plural}</button>`).join('')}</div>
        <button class="btn btn-primary btn-sm" style="margin-left:auto;" data-action="add-geo" data-level="${level}">${icons.plus}Add ${levelInfo.label}</button>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Name</th><th>Code</th>${parentInfo ? `<th>${parentInfo.label}</th>` : ''}<th>Status</th><th class="right">Actions</th></tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td class="cell-primary">${esc(r.name)}</td>
                <td>${esc(r.code)}</td>
                ${parentInfo ? `<td>${esc(geoName(parentInfo.key, r[levelInfo.parentField]))}</td>` : ''}
                <td><span class="badge ${r.isActive ? 'badge-success' : 'badge-muted'}">${r.isActive ? 'Active' : 'Inactive'}</span></td>
                <td class="right">
                  <div class="row-actions">
                    <button class="icon-btn-sm" title="Edit" data-action="edit-geo" data-level="${level}" data-id="${r.id}">${icons.edit}</button>
                    <button class="icon-btn-sm danger" title="Delete" data-action="delete-geo" data-level="${level}" data-id="${r.id}">${icons.trash}</button>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}
function geoFormBody(level, r) {
  const levelInfo = GEO_LEVELS.find(l => l.key === level);
  const parentInfo = levelInfo.parentKey ? GEO_LEVELS.find(l => l.key === levelInfo.parentKey) : null;
  return `
    <div class="form-grid">
      <div class="field"><label>Name</label><input class="input" name="name" value="${r ? esc(r.name) : ''}" required /></div>
      <div class="field"><label>Code</label><input class="input" name="code" value="${r ? esc(r.code) : ''}" required /></div>
      ${parentInfo ? `<div class="field full"><label>${parentInfo.label}</label><select class="input" name="parentId">${parentInfo.list().filter(x => x.isActive).map(x => `<option value="${x.id}" ${r && r[levelInfo.parentField] === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : ''}
      <div class="field full"><label class="checkbox-row" style="margin-top:6px;"><input type="checkbox" name="isActive" ${!r || r.isActive ? 'checked' : ''} /> Active</label></div>
    </div>`;
}
function openGeoForm(level, r) {
  const levelInfo = GEO_LEVELS.find(l => l.key === level);
  openFormModal({
    title: r ? `Edit ${levelInfo.label}` : `Add ${levelInfo.label}`, submitLabel: r ? 'Save changes' : 'Add',
    bodyHtml: geoFormBody(level, r),
    onSubmit: (fd) => {
      const data = { name: fd.get('name'), code: fd.get('code'), isActive: fd.get('isActive') === 'on' };
      if (levelInfo.parentField) data[levelInfo.parentField] = Number(fd.get('parentId'));
      if (r) { Object.assign(r, data); logActivity('Master Data', 'Update', `${levelInfo.label}: ${data.name}`); showToast('success', `${levelInfo.label} updated.`); }
      else { const newId = geoIdSeq[level]++; levelInfo.list().push({ id: newId, ...data }); logActivity('Master Data', 'Create', `${levelInfo.label}: ${data.name}`); showToast('success', `${levelInfo.label} added.`); }
      closeModal(); if (state.route === 'content') renderApp();
    }
  });
}
function geoHasChildren(level, id) {
  const idx = GEO_LEVELS.findIndex(l => l.key === level);
  const child = GEO_LEVELS[idx + 1];
  return child ? child.list().some(x => x[child.parentField] === id) : false;
}

function submitRoleForm(fd) {
  const r = state.roleFormId === 'new' ? null : roles.find(x => x.id === state.roleFormId);
  const permissions = {};
  PERMISSION_MODULES.forEach(mod => {
    permissions[mod] = perm(fd.get(`create_${mod}`) === 'on', fd.get(`update_${mod}`), fd.get(`assign_${mod}`) === 'on', fd.get(`review_${mod}`) === 'on');
  });
  const name = fd.get('name');
  if (r) { const oldName = r.name; r.name = name; r.permissions = permissions; if (oldName !== name) users.forEach(u => { if (u.role === oldName) u.role = name; }); logActivity('Users', 'Update role', name); showToast('success', 'Role updated.'); }
  else { roles.push({ id: `ROLE-${roleIdSeq++}`, name, permissions }); logActivity('Users', 'Create role', name); showToast('success', 'Role added.'); }
  state.roleFormId = null; renderApp();
}

function errorState(onRetry, title = 'Something went wrong', desc = 'We could not load this data. Please try again.') {
  window.__retryHandler = onRetry;
  return `<div class="state-block error"><div class="state-icon">${icons.alertTriangle}</div><h4>${esc(title)}</h4><p>${esc(desc)}</p><button class="btn btn-primary" onclick="window.__retryHandler()">${icons.refresh}Retry</button></div>`;
}
function paginationHtml(scope, page, totalPages, total, shown) {
  const start = total === 0 ? 0 : (page - 1) * state[scope].pageSize + 1;
  const end = start + shown - 1;
  let btns = '';
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - page) <= 1) {
      btns += `<button class="page-btn ${i === page ? 'active' : ''}" data-page-scope="${scope}" data-page="${i}">${i}</button>`;
    } else if (btns.slice(-3) !== '...') {
      btns += `<span style="padding:0 4px;color:var(--muted);">...</span>`;
    }
  }
  return `<div class="pagination">
    <div class="page-info">Showing ${start}-${end} of ${total}</div>
    <div class="page-btns">
      <button class="page-btn" data-page-scope="${scope}" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>${icons.chevLeft}</button>
      ${btns}
      <button class="page-btn" data-page-scope="${scope}" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''}>${icons.chevRight}</button>
    </div>
  </div>`;
}

  state.route = route;

  closeAllDropdowns();
  closeDrawer();
  loadRouteData(route);
  renderApp();
  window.scrollTo(0, 0);
  if (location.hash.slice(1) !== route) location.hash = route;
}
function loadRouteData(route) {

  s.loading = true;

    if (state.route === route) renderApp();

}

/* ==================== event delegation ==================== */
document.addEventListener('click', (e) => {
  const routeEl = e.target.closest('[data-route]');
  if (routeEl) { e.preventDefault(); navigate(routeEl.dataset.route); return; }

  if (e.target.closest('#collapseBtn')) { state.sidebarCollapsed = !state.sidebarCollapsed; renderSidebar(); return; }
  if (e.target.closest('#themeToggleBtn')) { toggleTheme(); return; }
  if (e.target.closest('#themeSwitchBtn')) { toggleTheme(); renderApp(); return; }
  if (e.target.closest('#drawerOpenBtn')) { openDrawer(); return; }
  if (e.target.closest('#drawerCloseBtn') || e.target === document.getElementById('drawerBackdrop')) { closeDrawer(); return; }

  if (e.target.closest('#notifBtn')) { const dd = document.getElementById('notifDropdown'); const wasOpen = dd.classList.contains('open'); closeAllDropdowns(); if (!wasOpen) dd.classList.add('open'); return; }
  if (e.target.closest('#profileBtn')) { const dd = document.getElementById('profileDropdown'); const wasOpen = dd.classList.contains('open'); closeAllDropdowns(); if (!wasOpen) dd.classList.add('open'); return; }
  if (!e.target.closest('.dropdown-wrap')) closeAllDropdowns();

  if (e.target.closest('#logoutBtn')) { closeAllDropdowns(); performLogout(); return; }
  if (e.target.closest('#otpBackBtn')) { state.auth.step = 'id'; state.auth.error = ''; renderAuth(); return; }
  if (e.target.closest('#markAllReadBtn')) { notifications.forEach(n => n.unread = false); renderApp(); showToast('success', 'All notifications marked as read.'); return; }

  if (e.target.closest('[data-close-modal]') || e.target === document.getElementById('overlayBackdrop')) {
    // A centered modal (e.g. the photo viewer) can be stacked on top of an open detail panel -
    // close only the topmost layer so "Close" on the photo doesn't also dismiss the panel behind it.
    const hasModal = document.getElementById('modalRoot').querySelector('.modal-card');
    if (hasModal) { closeModal(); if (document.getElementById('detailPanelRoot').querySelector('.detail-panel')) document.getElementById('overlayBackdrop').classList.add('open'); }
    else closeDetailPanel();
    return;
  }

  const pageBtn = e.target.closest('[data-page-scope]');
  if (pageBtn && !pageBtn.disabled) {
    const scope = pageBtn.dataset.pageScope; const p = parseInt(pageBtn.dataset.page, 10);
    state[scope].page = p; renderApp(); return;
  }

  const notifFilterBtn = e.target.closest('[data-notif-filter]');
  if (notifFilterBtn) { state.notifications.filter = notifFilterBtn.dataset.notifFilter; renderApp(); return; }

  const settingsTabBtn = e.target.closest('[data-settings-tab]');
  if (settingsTabBtn) { state.settingsTab = settingsTabBtn.dataset.settingsTab; renderApp(); return; }

  const opsTabBtn = e.target.closest('[data-optab]');
  if (opsTabBtn) { state.operations.tab = opsTabBtn.dataset.optab; state.operations.page = 1; renderApp(); return; }

  const trackerFilterBtn = e.target.closest('[data-tracker-filter]');
  if (trackerFilterBtn) { state.operations.trackerFilter = trackerFilterBtn.dataset.trackerFilter; state.operations.page = 1; renderApp(); return; }

  const mdTabBtn = e.target.closest('[data-mdtab]');
  if (mdTabBtn) { state.content.tab = mdTabBtn.dataset.mdtab; state.content.page = 1; renderApp(); return; }

  const geoLevelBtn = e.target.closest('[data-geo-level]');
  if (geoLevelBtn) { state.content.geoLevel = geoLevelBtn.dataset.geoLevel; renderApp(); return; }

  if (e.target.closest('#startSyncBtn')) { runMasterSync(); return; }

  const switchBtn = e.target.closest('[data-toggle-switch]');
  if (switchBtn) { switchBtn.classList.toggle('on'); return; }

  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    if (actionEl.hasAttribute('data-close-search')) {
      document.getElementById('globalSearchResults').classList.remove('open');
      document.getElementById('globalSearchInput').value = '';
      const routeByAction = { 'view-user': 'users', 'view-content': 'content', 'view-indent': 'operations', 'view-audit': 'operations' };
      const tabByAction = { 'view-indent': 'indents', 'view-audit': 'audits' };
      const route = routeByAction[actionEl.dataset.action];
      if (route) {
        if (tabByAction[actionEl.dataset.action]) state.operations.tab = tabByAction[actionEl.dataset.action];
        navigate(route);
      }
    }
    handleAction(actionEl.dataset.action, actionEl.dataset.id, actionEl);
    return;
  }
});

function handleAction(action, id, el) {
  if (action === 'qa-add-user') return openUserForm();
  if (action === 'add-user') return openUserForm();
  if (action === 'edit-user') return openUserForm(users.find(u => u.id === id));
  if (action === 'view-user') {
    const u = users.find(x => x.id === id);
    openDetailPanel({
      title: u.name, subtitle: `${u.role} · ${u.id}`,
      bodyHtml: dpSection('', [['Employee code', esc(u.sapcode || '-')], ['Email', esc(u.email)], ['Phone', esc(u.phone)], ['Role', esc(u.role)], ['Scope', esc(userScopeLabel(u))],
        ['Status', `<span class="badge ${statusBadgeClass(u.status)}">${u.status}</span>`], ['Last active', u.lastActive === '-' ? '-' : fmtDateTime(u.lastActive)]]),
      footerHtml: `<button class="btn btn-outline" data-close-modal>Close</button><button class="btn btn-primary" data-action="edit-user" data-id="${u.id}">${icons.edit}Edit</button>`,
    });
    return;
  }
  if (action === 'toggle-user') {
    const u = users.find(x => x.id === id);
    if (u.status === 'Active') {
      openConfirm({ title: 'Deactivate user?', message: `${u.name} will lose access to the app immediately.`, confirmLabel: 'Deactivate', danger: true, onConfirm: () => { u.status = 'Inactive'; logActivity('Users', 'Deactivate', u.name); renderApp(); showToast('success', `${u.name} has been deactivated.`); } });
    } else {
      u.status = 'Active'; logActivity('Users', 'Activate', u.name); renderApp(); showToast('success', `${u.name} has been activated.`);
    }
    return;
  }
  if (action === 'delete-user') {
    const u = users.find(x => x.id === id);
    openConfirm({ title: 'Delete user?', message: `This will permanently remove ${u.name}'s account. This cannot be undone.`, confirmLabel: 'Delete', danger: true, iconName: 'trash', onConfirm: () => { users = users.filter(x => x.id !== id); logActivity('Users', 'Delete', u.name); renderApp(); showToast('success', 'User deleted.'); } });
    return;
  }

  if (action === 'add-role') { state.roleFormId = 'new'; closeDetailPanel(); renderApp(); return; }
  if (action === 'edit-role') { state.roleFormId = id; closeDetailPanel(); renderApp(); return; }
  if (action === 'cancel-role-form') { state.roleFormId = null; renderApp(); return; }
  if (action === 'view-role') {
    const r = roles.find(x => x.id === id);
    openDetailPanel({
      title: r.name, subtitle: `${users.filter(u => u.role === r.name).length} user(s) assigned`,
      bodyHtml: PERMISSION_MODULES.map(mod => {
        const p = r.permissions[mod] || emptyPerm();
        return dpSection(mod, [['Create', p.create ? 'Yes' : 'No'], ['Update', p.update], ['Assign / Reassign', p.assignReassign ? 'Yes' : 'No'], ['Review', p.review ? 'Yes' : 'No']]);
      }).join(''),
      footerHtml: `<button class="btn btn-outline" data-close-modal>Close</button><button class="btn btn-primary" data-action="edit-role" data-id="${r.id}">${icons.edit}Edit</button>`,
    });
    return;
  }
  if (action === 'delete-role') {
    const r = roles.find(x => x.id === id);
    const assigned = users.filter(u => u.role === r.name).length;
    if (assigned) { showToast('error', `Can't delete "${r.name}": ${assigned} user(s) still have this role. Reassign them first.`); return; }
    openConfirm({ title: 'Delete role?', message: `"${r.name}" will be permanently removed.`, confirmLabel: 'Delete', danger: true, iconName: 'trash', onConfirm: () => { roles = roles.filter(x => x.id !== id); logActivity('Users', 'Delete role', r.name); closeDetailPanel(); renderApp(); showToast('success', 'Role deleted.'); } });
    return;
  }

  if (action === 'qa-add-content' || action === 'add-content') return openContentForm(null, el && el.dataset.type);
  if (action === 'edit-content') return openContentForm(masterData.find(m => m.id === id));
  if (action === 'view-content') {
    const m = masterData.find(x => x.id === id);
    const rows = [['Type', esc(m.type)], ['Code', esc(m.code)], ['Owner', esc(m.owner)], ['Status', `<span class="badge ${statusBadgeClass(m.status)}">${m.status}</span>`], ['Updated', fmtDate(m.updatedAt)]];
    let extra = '';
    if (m.type === 'Outlet' && m.accountNumber) {
      const fuels = [['MS', m.fuelMs], ['HSD', m.fuelHsd], ['CNG', m.fuelCng], ['LPG', m.fuelLpg]].filter(f => f[1]).map(f => f[0]);
      extra = dpSection('Classification & location', [['Outlet type', esc(m.outletType || '-')], ['Category', esc(m.category || '-')], ['Fuel types', fuels.length ? fuels.join(', ') : '-'], ['Territory', esc(m.territoryId ? geoName('territory', m.territoryId) : '-')], ['District', esc(m.districtId ? geoName('district', m.districtId) : '-')], ['Reg. No', esc(m.regNo || '-')], ['Highway No', esc(m.highwayNo || '-')]])
        + dpSection('Contacts', [['Contact person', esc(m.contactPerson || '-')], ['RO email', esc(m.roEmail || '-')], ['RO mobile', esc(m.roMobile || '-')], ['Dealer / franchisee', esc(m.dealer)], ['Franchisee email', esc(m.franchiseeEmail || '-')], ['Franchisee mobile', esc(m.franchiseeMobile || '-')]])
        + dpSection('Account information', [['CMS code', esc(m.cmsCode)], ['TSM', `${esc(m.tsmName)} (${esc(m.tsmPhone)})`], ['Divisional Manager', `${esc(m.dmName)} (${esc(m.dmPhone)})`], ['Account number', esc(m.accountNumber)], ['Account balance', `<span style="color:${m.accountBalance ? 'var(--danger)' : 'var(--success)'};">₹${m.accountBalance.toLocaleString('en-IN')}</span>`]]);
    }
    openDetailPanel({ title: m.title, subtitle: m.type, bodyHtml: dpSection('', rows) + extra, footerHtml: `<button class="btn btn-outline" data-close-modal>Close</button><button class="btn btn-primary" data-action="edit-content" data-id="${m.id}">${icons.edit}Edit</button>` });
    return;
  }
  if (action === 'toggle-content') {
    const m = masterData.find(x => x.id === id);
    if (m.status !== 'Archived') {
      openConfirm({ title: 'Archive this item?', message: `"${m.title}" will be archived and hidden from the field app.`, confirmLabel: 'Archive', danger: true, onConfirm: () => { m.status = 'Archived'; m.updatedAt = new Date().toISOString(); logActivity('Master Data', 'Archive', m.title); renderApp(); showToast('success', 'Item archived.'); } });
    } else {
      m.status = 'Published'; m.updatedAt = new Date().toISOString(); logActivity('Master Data', 'Publish', m.title); renderApp(); showToast('success', 'Item published.');
    }
    return;
  }
  if (action === 'delete-content') {
    const m = masterData.find(x => x.id === id);
    openConfirm({ title: 'Delete item?', message: `"${m.title}" will be permanently removed from master data.`, confirmLabel: 'Delete', danger: true, iconName: 'trash', onConfirm: () => { masterData = masterData.filter(x => x.id !== id); logActivity('Master Data', 'Delete', m.title); renderApp(); showToast('success', 'Item deleted.'); } });
    return;
  }

  if (action === 'add-geo') return openGeoForm(el.dataset.level);
  if (action === 'edit-geo') { const levelInfo = GEO_LEVELS.find(l => l.key === el.dataset.level); return openGeoForm(el.dataset.level, levelInfo.list().find(x => x.id === Number(id))); }
  if (action === 'delete-geo') {
    const level = el.dataset.level;
    const levelInfo = GEO_LEVELS.find(l => l.key === level);
    const r = levelInfo.list().find(x => x.id === Number(id));
    if (geoHasChildren(level, r.id)) { showToast('error', `Can't delete "${r.name}": it still has ${GEO_LEVELS[GEO_LEVELS.findIndex(l => l.key === level) + 1].label.toLowerCase()}s under it. Remove those first.`); return; }
    openConfirm({ title: `Delete ${levelInfo.label.toLowerCase()}?`, message: `"${r.name}" will be permanently removed.`, confirmLabel: 'Delete', danger: true, iconName: 'trash', onConfirm: () => {

      logActivity('Master Data', 'Delete', `${levelInfo.label}: ${r.name}`); renderApp(); showToast('success', `${levelInfo.label} deleted.`);
    } });

  }

  if (action === 'add-branding') return openBrandingForm();
  if (action === 'edit-branding') return openBrandingForm(roBranding.find(x => x.id === Number(id)));
  if (action === 'delete-branding') {

  }

  if (action === 'add-stockvar') return openStockVarForm();
  if (action === 'edit-stockvar') return openStockVarForm(stockVariationRules.find(x => x.id === Number(id)));
  if (action === 'delete-stockvar') {
    const v = stockVariationRules.find(x => x.id === Number(id));
    openConfirm({ title: 'Delete rule?', message: `The ${v.stockType} ${v.meterPercent} variation rule will be permanently removed.`, confirmLabel: 'Delete', danger: true, iconName: 'trash', onConfirm: () => { stockVariationRules = stockVariationRules.filter(x => x.id !== Number(id)); logActivity('Master Data', 'Delete', `Stock variation rule: ${v.stockType} ${v.meterPercent}`); renderApp(); showToast('success', 'Rule deleted.'); } });
    return;
  }

  if (action === 'view-indent') {
    const i = indents.find(x => x.id === id);
    const stepIdx = INDENT_STEPS.indexOf(i.status);
    openDetailPanel({
      title: i.id, subtitle: i.outletName,
      bodyHtml: dpSection('', [['Dealer', esc(i.dealerName)], ['Product', esc(i.product)], ['Quantity', `${i.quantity.toLocaleString('en-IN')} ${esc(i.unit)}`], ['Required date', fmtDate(i.requiredDate)]])
        + `<div class="dp-section"><div class="dp-section-title">Fulfilment status</div><div class="indent-status-row">${INDENT_STEPS.map((st, idx) => `<span class="indent-status-step ${idx <= stepIdx ? 'done' : ''}">${idx <= stepIdx ? icons.checkCircle : icons.info}<span>${INDENT_STATUS_LABEL[st]}</span></span>`).join('')}</div></div>`,
      footerHtml: `<button class="btn btn-outline" data-close-modal>Close</button>${i.status !== 'C' ? `<button class="btn btn-primary" data-action="advance-indent" data-id="${i.id}">${icons.refresh}Advance status</button>` : ''}`,
    });
    return;
  }
  if (action === 'advance-indent') {
    const i = indents.find(x => x.id === id);
    const idx = INDENT_STEPS.indexOf(i.status);
    if (idx < INDENT_STEPS.length - 1) { i.status = INDENT_STEPS[idx + 1]; logActivity('Operations', 'Advance indent', `${i.id} → ${INDENT_STATUS_LABEL[i.status]}`); }
    closeDetailPanel(); renderApp(); showToast('success', `${i.id} moved to "${INDENT_STATUS_LABEL[i.status]}".`);
    return;
  }
  if (action === 'cancel-indent') {
    const i = indents.find(x => x.id === id);
    openConfirm({ title: 'Cancel indent?', message: `${i.id} for ${i.outletName} will be marked as cancelled and removed from the active list.`, confirmLabel: 'Cancel Indent', danger: true, onConfirm: () => { indents = indents.filter(x => x.id !== id); logActivity('Operations', 'Cancel indent', i.id); renderApp(); showToast('success', 'Indent cancelled.'); } });
    return;
  }

  if (action === 'view-audit') {
    const a = auditForms.find(x => x.id === id);
    const pct = auditCompletionPct(a);
    openDetailPanel({
      title: a.outletName, subtitle: `RO Audit Form · ${a.refNo}`,
      bodyHtml: dpSection('RO details', [['Reg. No', esc(a.regNo)], ['TSM', esc(a.tsmName)], ['Divisional Manager', esc(a.divisionalManager)], ['Visit date', fmtDate(a.visitDate)], ['Previous visit', fmtDate(a.prevVisitDate)], ['Status', `<span class="badge ${statusBadgeClass(a.status)}">${a.status}</span>`]])
        + `<div class="dp-section"><div class="dp-section-title">Form completion (${pct}%)</div>`
        + auditChecklist(a).map(i => `<div class="dp-row"><span class="dp-k">${esc(i.label)}</span><span class="dp-v">${i.done ? `<span class="badge badge-success">${icons.check}Done</span>` : `<span class="badge badge-danger">Missing</span>`}</span></div>`).join('')
        + `</div>`
        + `<div class="dp-section"><div class="dp-section-title">Photos captured (${a.photosCaptured}/2)</div><div class="dp-photo-grid">`
        + AUDIT_PHOTO_SLOTS.map((slot, i) => a.photosCaptured > i
            ? `<div class="dp-photo-tile"><button class="dp-photo-btn" data-action="view-photo" data-id="${a.id}" data-slot="${i}"><img src="${mockPhotoDataUri(slot, a.outletName)}" alt="${esc(slot)}" /></button><div class="dp-photo-caption">${esc(slot)}</div></div>`
            : `<div class="dp-photo-tile missing">${icons.camera}<div class="dp-photo-caption">${esc(slot)}, not captured</div></div>`
          ).join('')
        + `</div></div>`
        + `<div class="dp-section"><div class="dp-section-title">Attendance (${a.attendees.length})</div>`
        + (a.attendees.length ? `<div class="dp-chip-list">${a.attendees.map(n => `<span class="chip" style="cursor:default;">${esc(n)}</span>`).join('')}</div>` : `<p style="font-size:13px;color:var(--text-secondary);">No attendees logged for this visit.</p>`)
        + `</div>`
        + `<div class="dp-section" style="border-top:1px solid var(--divider);padding-top:16px;"><div class="dp-section-title">Full form: every section as captured on the visit</div></div>`
        + CRA_FORM_SECTIONS.map(s => {
            const data = (a.sections || {})[s.key];
            return sectionHasData(data)
              ? dpSection(s.label, sectionRows(data))
              : `<div class="dp-section"><div class="dp-section-title">${esc(s.label)}</div><p style="font-size:12.5px;color:var(--muted);">Not captured for this visit.</p></div>`;
          }).join(''),
      footerHtml: `<button class="btn btn-outline" data-close-modal>Close</button><button class="btn btn-danger" data-action="delete-audit" data-id="${a.id}">${icons.trash}Delete</button>`,
    });
    return;
  }
  if (action === 'view-photo') {
    const a = auditForms.find(x => x.id === id);
    const slot = AUDIT_PHOTO_SLOTS[Number(el.dataset.slot)];
    openPhotoViewer({ label: slot, sublabel: a.outletName, dataUri: mockPhotoDataUri(slot, a.outletName), meta: `${a.outletName} · visited ${fmtDate(a.visitDate)}` });
    return;
  }
  if (action === 'delete-audit') {
    const a = auditForms.find(x => x.id === id);
    openConfirm({ title: 'Delete audit form?', message: `The RO Audit Form for ${a.outletName} (${a.refNo}) will be permanently removed.`, confirmLabel: 'Delete', danger: true, iconName: 'trash', onConfirm: () => { auditForms = auditForms.filter(x => x.id !== id); logActivity('Operations', 'Delete audit', `${a.outletName} (${a.refNo})`); closeDetailPanel(); renderApp(); showToast('success', 'Audit form deleted.'); } });
    return;
  }

  if (action === 'view-tracker') {
    const r = monthlyTracker.find(x => x.outletName === id);
    const answered = r.answers.filter(a => a.status !== null).length;
    const statusBadge = (st) => st === 'yes' ? `<span class="badge badge-success">Yes</span>` : st === 'no' ? `<span class="badge badge-danger">No</span>` : `<span class="badge badge-muted">Not answered</span>`;
    openDetailPanel({
      title: r.outletName, subtitle: `RO Monthly Tracker · ${r.month}`,
      bodyHtml: dpSection('', [['TSM', esc(r.tsmName)], ['Completion', `${r.percentage}%`], ['Status', `<span class="badge ${statusBadgeClass(trackerStatusLabel(r))}">${trackerStatusLabel(r)}</span>`]])
        + `<div class="dp-section"><div class="dp-section-title">Checklist (${answered}/${r.answers.length} answered)</div>`
        + r.answers.map(a => `<div class="dp-row"><span class="dp-k">${esc(a.question)}</span><span class="dp-v">${statusBadge(a.status)}</span></div>`).join('')
        + `</div>`,
    });
    return;
  }

  if (action === 'view-tsm') {
    const t = users.find(x => x.id === id);
    const assigned = masterData.filter(m => m.type === 'Outlet' && m.tsmName === t.name);
    const tAudits = auditForms.filter(a => a.tsmName === t.name);
    const tTracker = monthlyTracker.filter(r => r.tsmName === t.name);
    const tIndents = indents.filter(i => assigned.some(o => o.title === i.outletName));
    openDetailPanel({
      title: t.name, subtitle: `${t.role} · ${userScopeLabel(t)}`,
      bodyHtml: dpSection('Contact', [['Email', esc(t.email)], ['Phone', esc(t.phone)], ['Status', `<span class="badge ${statusBadgeClass(t.status)}">${t.status}</span>`]])
        + dpSection('Field activity', [['Assigned outlets', assigned.length], ['Audit forms submitted', tAudits.length], ['Tracker records', tTracker.length], ['Indents raised', tIndents.length]])
        + (assigned.length ? `<div class="dp-section"><div class="dp-section-title">Assigned outlets</div><div class="dp-chip-list">${assigned.map(o => `<span class="chip" style="cursor:default;">${esc(o.title)}</span>`).join('')}</div></div>` : ''),
      footerHtml: `<button class="btn btn-outline" data-close-modal>Close</button><button class="btn btn-primary" data-action="edit-user" data-id="${t.id}">${icons.edit}Edit</button>`,
    });
    return;
  }

  if (action === 'view-account') {
    const m = masterData.find(x => x.id === id);
    openDetailPanel({
      title: m.title, subtitle: 'Account Information',
      bodyHtml: dpSection('Outlet', [['Dealer', esc(m.dealer)], ['CMS code', esc(m.cmsCode)], ['TSM', `${esc(m.tsmName)} (${esc(m.tsmPhone)})`], ['Divisional Manager', `${esc(m.dmName)} (${esc(m.dmPhone)})`]])
        + dpSection('Account', [['Account number', esc(m.accountNumber)], ['Outstanding balance', `<span style="color:${m.accountBalance ? 'var(--danger)' : 'var(--success)'};">₹${m.accountBalance.toLocaleString('en-IN')}</span>`]]),
    });
    return;
  }

  if (action === 'qa-review-tasks') { state.operations.tab = 'tasks'; return navigate('operations'); }
  if (action === 'qa-master-sync') { state.settingsTab = 'sync'; return navigate('settings'); }
  if (action === 'qa-generate-report') return navigate('reports');
  if (action === 'generate-report') {
    const s = state.reports;
    s.generating = true; s.genError = false; renderApp();
    setTimeout(() => {
      s.generating = false;
      const willFail = Math.random() < 0.2;
      if (willFail) {
        s.genError = true; renderApp(); showToast('error', 'Report generation failed.');
      } else {
        const rpt = { id: `RPT-${rptIdSeq++}`, name: 'Ad-hoc Analytics Report', type: ['Sales', 'Inventory', 'Audit', 'Indent'][Math.floor(Math.random() * 4)], dateRange: 'Custom range', generatedBy: CURRENT_ADMIN.name, generatedAt: new Date().toISOString(), status: 'Ready', sizeKb: Math.round(150 + Math.random() * 800) };
        reports.unshift(rpt); logActivity('Reports', 'Generate', rpt.name);
        renderApp(); showToast('success', 'Report generated successfully.');
      }
    }, 1100);
    return;
  }
  if (action === 'download-report') { showToast('info', 'Downloading report (demo only).'); return; }
  if (action === 'view-report') {
    const r = reports.find(x => x.id === id);
    openDetailPanel({
      title: r.name, subtitle: r.type,
      bodyHtml: dpSection('', [['Date range', esc(r.dateRange)], ['Generated by', esc(r.generatedBy)], ['Generated at', fmtDateTime(r.generatedAt)], ['Status', `<span class="badge ${statusBadgeClass(r.status)}">${r.status}</span>`], ['Size', r.sizeKb ? r.sizeKb + ' KB' : '-']]),
      footerHtml: `<button class="btn btn-outline" data-close-modal>Close</button>${r.status === 'Ready' ? `<button class="btn btn-primary" data-action="download-report" data-id="${r.id}">${icons.download}Download</button>` : ''}`,
    });
    return;
  }
  if (action === 'delete-report') {
    const r = reports.find(x => x.id === id);
    openConfirm({ title: 'Delete report?', message: `"${r.name}" will be permanently deleted.`, confirmLabel: 'Delete', danger: true, iconName: 'trash', onConfirm: () => { reports = reports.filter(x => x.id !== id); logActivity('Reports', 'Delete', r.name); renderApp(); showToast('success', 'Report deleted.'); } });
    return;
  }

  if (action === 'qa-send-notif' || action === 'compose-notif') {
    openFormModal({
      title: 'Compose Notification', submitLabel: 'Send',
      bodyHtml: `
        <div class="field"><label>Title</label><input class="input" name="title" required /></div>
        <div class="field"><label>Message</label><textarea class="input" name="desc" required></textarea></div>
        <div class="field"><label>Audience</label><select class="input" name="audience"><option>All Users</option><option>All Admins</option><option>TSM - Ahmedabad</option><option>HOS</option></select></div>
        <div class="field"><label>Type</label><select class="input" name="type"><option value="info">Info</option><option value="success">Success</option><option value="warning">Warning</option><option value="danger">Critical</option></select></div>`,
      onSubmit: (fd) => {
        notifications.unshift({ id: `N-${notifIdSeq++}`, title: fd.get('title'), desc: fd.get('desc'), audience: fd.get('audience'), type: fd.get('type'), unread: true, time: new Date().toISOString() });
        logActivity('Notifications', 'Send', fd.get('title'));
        closeModal(); if (state.route === 'notifications') renderApp(); showToast('success', 'Notification sent.');
      }
    });
    return;
  }
  if (action === 'mark-all-read') { notifications.forEach(n => n.unread = false); renderApp(); showToast('success', 'All notifications marked as read.'); return; }
  if (action === 'notif-read') { const n = notifications.find(x => x.id === id); n.unread = false; renderApp(); return; }
  if (action === 'notif-delete') {
    openConfirm({ title: 'Delete notification?', message: 'This notification will be permanently removed.', confirmLabel: 'Delete', danger: true, iconName: 'trash', onConfirm: () => { notifications = notifications.filter(x => x.id !== id); renderApp(); showToast('success', 'Notification deleted.'); } });
    return;
  }
}

function openUserForm(u) {
  openFormModal({
    title: u ? 'Edit User' : 'Add User', submitLabel: u ? 'Save changes' : 'Add User', bodyHtml: userFormBody(u),
    onSubmit: (fd) => {
      const scopeLevel = fd.get('scopeLevel');
      const scopeValue = scopeLevel !== 'all' ? Number(fd.get('scopeValue')) : null;
      const data = {
        name: fd.get('name'), sapcode: fd.get('sapcode'), email: fd.get('email'), phone: fd.get('phone'), role: fd.get('role'),
        territoryId: scopeLevel === 'territory' ? scopeValue : null,
        districtId: scopeLevel === 'district' ? scopeValue : null,
        divisionId: scopeLevel === 'division' ? scopeValue : null,
        stateId: scopeLevel === 'state' ? scopeValue : null,
      };
      if (u) { Object.assign(u, data); logActivity('Users', 'Update', u.name); showToast('success', 'User updated.'); }
      else { users.push({ id: `U-${userIdSeq++}`, status: 'Pending', lastActive: '-', ...data }); logActivity('Users', 'Create', data.name); showToast('success', 'User added.'); }
      closeModal(); closeDetailPanel(); if (state.route === 'users') renderApp();
    }
  });
}
const OUTLET_ONLY_FIELDS = ['dealer', 'tsmName', 'tsmPhone', 'dmName', 'dmPhone', 'cmsCode', 'accountNumber', 'accountBalance', 'outletType', 'category', 'fuelMs', 'fuelHsd', 'fuelCng', 'fuelLpg', 'zoneId', 'stateId', 'divisionId', 'districtId', 'territoryId', 'contactPerson', 'roEmail', 'roMobile', 'franchiseeEmail', 'franchiseeMobile', 'regNo', 'highwayNo'];
function openContentForm(m, defaultType) {
  openFormModal({
    title: m ? (m.type === 'Outlet' ? 'Edit Outlet' : 'Edit Item') : ((defaultType || 'Outlet') === 'Outlet' ? 'Add Outlet' : 'Add Data Item'),
    submitLabel: m ? 'Save changes' : 'Add Item', bodyHtml: contentFormBody(m, defaultType),
    onSubmit: (fd) => {
      const type = fd.get('type');
      const data = { title: fd.get('title'), type, code: fd.get('code'), owner: fd.get('owner'), status: fd.get('status') };
      // Outlets carry the same account-info fields the mobile app's Account Info screen shows, so a
      // newly created outlet immediately shows up in TSM Management's assigned outlets and in the
      // Accounts & Outstanding page, nothing created here is a dead end.
      if (type === 'Outlet') {
        const tsm = users.find(u => u.name === fd.get('tsmName'));
        const dm = users.find(u => u.name === fd.get('dmName'));
        Object.assign(data, geoAncestry(Number(fd.get('territoryId'))), {
          dealer: fd.get('dealer'),
          tsmName: fd.get('tsmName') || '', tsmPhone: tsm ? tsm.phone : '',
          dmName: fd.get('dmName') || '', dmPhone: dm ? dm.phone : '',
          cmsCode: fd.get('cmsCode'), accountNumber: fd.get('accountNumber'),
          accountBalance: Number(fd.get('accountBalance')) || 0,
          outletType: fd.get('outletType'), category: fd.get('category'),
          fuelMs: fd.get('fuelMs') === 'on', fuelHsd: fd.get('fuelHsd') === 'on', fuelCng: fd.get('fuelCng') === 'on', fuelLpg: fd.get('fuelLpg') === 'on',
          contactPerson: fd.get('contactPerson'), roEmail: fd.get('roEmail'), roMobile: fd.get('roMobile'),
          franchiseeEmail: fd.get('franchiseeEmail'), franchiseeMobile: fd.get('franchiseeMobile'),
          regNo: fd.get('regNo'), highwayNo: fd.get('highwayNo'),
        });
      } else if (m) {
        // Type was switched away from Outlet on edit, drop the now-irrelevant outlet fields.
        OUTLET_ONLY_FIELDS.forEach(f => delete m[f]);
      }
      if (m) { Object.assign(m, data); m.updatedAt = new Date().toISOString(); logActivity('Master Data', 'Update', m.title); showToast('success', 'Item updated.'); }
      else { masterData.push({ id: `MD-${mdIdSeq++}`, updatedAt: new Date().toISOString(), ...data }); logActivity('Master Data', 'Create', data.title); showToast('success', `Item added.${type === 'Outlet' && data.tsmName ? ` Now assigned to ${data.tsmName} in TSM Management.` : ''}`); }
      closeModal(); closeDetailPanel(); if (state.route === 'content') renderApp();
    }
  });
}

document.addEventListener('focusin', (e) => { if (e.target.id === 'globalSearchInput') runGlobalSearch(e.target.value); });
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('globalSearchInput')?.focus(); }
  if (e.key === 'Escape') {
    document.getElementById('globalSearchResults')?.classList.remove('open');
    closeAllDropdowns();
    const hasModal = document.getElementById('modalRoot').querySelector('.modal-card');
    if (hasModal) { closeModal(); if (document.getElementById('detailPanelRoot').querySelector('.detail-panel')) document.getElementById('overlayBackdrop').classList.add('open'); }
    else closeDetailPanel();
  }
});

/* ==================== init ==================== */
try { applyTheme(localStorage.getItem('mm-admin-theme') === 'dark' ? 'dark' : 'light'); } catch (e) { applyTheme('light'); }
showAuthScreen();
window.addEventListener('hashchange', () => { if (state.authenticated) navigate(location.hash.slice(1)); });
</script>
